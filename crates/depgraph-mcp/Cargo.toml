[package]
name = "depgraph-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "depgraph-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
depgraph-core = { path = "../depgraph-core" }
depgraph-mcp-tools = { path = "../depgraph-mcp-tools" }
rmcp = { version = "=3.1.0", default-features = false, features = ["server", "transport-io"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
depgraph-store = { path = "../depgraph-store" }
jsonschema = { version = "0.47", default-features = false }
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
wait-timeout = "0.2"
