[package]
name = "depgraph-operation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Durable SQLite operation journal for depgraph Agent operations"

[[bin]]
name = "depgraph-operation-runner"
path = "src/bin/depgraph-operation-runner.rs"

[dependencies]
clap.workspace = true
depgraph-core = { path = "../depgraph-core" }
depgraph-mcp-tools = { path = "../depgraph-mcp-tools" }
getrandom.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
