[package]
name = "depgraph-protocol"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Versioned NDJSON protocol contracts for depgraph workers"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
jsonschema = { version = "0.47", default-features = false }
pretty_assertions = "1.4"
tempfile = "3.20"
