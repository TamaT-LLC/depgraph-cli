[package]
name = "depgraph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Release builds only. The `depgraph` binary requires a release manifest for
# every worker lookup (see `depgraph_core::worker::require_release_manifest`).
packaged = []

[[bin]]
name = "depgraph"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
depgraph-agent-contract = { path = "../depgraph-agent-contract" }
depgraph-core = { path = "../depgraph-core" }
depgraph-operation = { path = "../depgraph-operation" }
depgraph-protocol = { path = "../depgraph-protocol" }
depgraph-store = { path = "../depgraph-store" }
directories.workspace = true
flate2 = "1.1"
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zip = { version = "8.1", default-features = false, features = ["deflate-flate2"] }
workspace-hack = { version = "0.7", path = "../../workspace-hack" }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
