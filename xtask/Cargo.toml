license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
depgraph-agent-contract = { path = "../crates/depgraph-agent-contract" }
depgraph-core = { path = "../crates/depgraph-core" }
depgraph-operation = { path = "../crates/depgraph-operation" }
depgraph-protocol = { path = "../crates/depgraph-protocol" }
depgraph-store = { path = "../crates/depgraph-store" }
flate2 = "1.1"
hex.workspace = true
rusqlite.workspace = true
same-file = "1.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
spdx = "0.13"
tar = { version = "0.4", default-features = false }
tempfile.workspace = true
toml.workspace = true
walkdir.workspace = true
