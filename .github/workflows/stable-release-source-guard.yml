name: Stable release source guard

on:
  workflow_run:
    workflows: ["Release"]
    types: [requested]

permissions: {}

jobs:
  guard-stable-tags:
    if: >-
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'v0.4.0' ||
       github.event.workflow_run.head_branch == 'v0.5.0' ||
       github.event.workflow_run.head_branch == 'v0.5.1' ||
       github.event.workflow_run.head_branch == 'v0.5.2' ||
       github.event.workflow_run.head_branch == 'v0.5.3' ||
       github.event.workflow_run.head_branch == 'v0.5.4')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Guard immutable historical and current stable tag sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RELEASE_TAG: v0.4.0
          EXPECTED_RELEASE_SOURCE_SHA: d5ca92bae4b4fdbbedb2f3cabd4aa3ef731e7c9f
          V0_5_0_RELEASE_TAG: v0.5.0
          V0_5_0_RELEASE_SOURCE_SHA: f1071178d3888503b6e02d4aec5e058f0b87d035
          V0_5_1_RELEASE_TAG: v0.5.1
          V0_5_1_RELEASE_SOURCE_SHA: 87f3f54d7568b1302be4c15c5377f669ec161396
          V0_5_2_RELEASE_TAG: v0.5.2
          V0_5_2_RELEASE_SOURCE_SHA: 08e077b9b2f7dbe6dd919ae75e0c20f559b14cbb
          V0_5_3_RELEASE_TAG: v0.5.3
          V0_5_3_RELEASE_SOURCE_SHA: ebac6e8836905164d5e1522f7c87844d5d8e2fe7
          STABLE_RELEASE_TAG: v0.5.4
          STABLE_MAINTENANCE_REF: heads/release/0.5
          STABLE_MAIN_REF: heads/main
          STABLE_BASELINE_STATUS: maintenance-ref-pinned
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == "$STABLE_RELEASE_TAG" ]]; then
            fetch_ref_sha() {
              local ref="$1"
              local allow_missing="$2"
              local response
              local http_status
              local sha
              if response="$(gh api --include "repos/$REPOSITORY/git/ref/$ref" --jq '.object.sha' 2>/dev/null)"; then
                sha="$(tail -n 1 <<<"$response")"
                [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || return 1
                printf '%s\n' "$sha"
                return 0
              fi
              http_status="$(awk '$1 ~ /^HTTP\// { status = $2 } END { print status }' <<<"$response")"
              if [[ "$allow_missing" == "true" && "$http_status" == "404" ]]; then
                printf '%s\n' missing
                return 0
              fi
              return 1
            }

            if ! main_sha="$(fetch_ref_sha "$STABLE_MAIN_REF" false)"; then
              gh api --method POST \
                "repos/$REPOSITORY/actions/runs/$RELEASE_RUN_ID/cancel" || true
              echo "::error::unable to verify $STABLE_MAIN_REF; signed tag preserved for retry"
              exit 1
            fi
            if ! maintenance_sha="$(fetch_ref_sha "$STABLE_MAINTENANCE_REF" true)"; then
              gh api --method POST \
                "repos/$REPOSITORY/actions/runs/$RELEASE_RUN_ID/cancel" || true
              echo "::error::unable to verify $STABLE_MAINTENANCE_REF; signed tag preserved for retry"
              exit 1
            fi
            if [[ "$maintenance_sha" != "missing" &&
                  "$RELEASE_SOURCE_SHA" == "$maintenance_sha" &&
                  "$RELEASE_SOURCE_SHA" == "$main_sha" ]]; then
              echo "$RELEASE_TAG source is the exact main and release/0.5 baseline ($STABLE_BASELINE_STATUS)"
              exit 0
            fi

            gh api --method POST \
              "repos/$REPOSITORY/actions/runs/$RELEASE_RUN_ID/cancel" || true
            gh api --method DELETE \
              "repos/$REPOSITORY/git/refs/tags/$STABLE_RELEASE_TAG"
            echo "::error::$STABLE_RELEASE_TAG source $RELEASE_SOURCE_SHA is not the exact main/release/0.5 baseline ($STABLE_BASELINE_STATUS; main=$main_sha maintenance=$maintenance_sha)"
            exit 1
          fi

          historical_source_sha=""
          if [[ "$RELEASE_TAG" == "$EXPECTED_RELEASE_TAG" ]]; then
            historical_source_sha="$EXPECTED_RELEASE_SOURCE_SHA"
          elif [[ "$RELEASE_TAG" == "$V0_5_0_RELEASE_TAG" ]]; then
            historical_source_sha="$V0_5_0_RELEASE_SOURCE_SHA"
          elif [[ "$RELEASE_TAG" == "$V0_5_1_RELEASE_TAG" ]]; then
            historical_source_sha="$V0_5_1_RELEASE_SOURCE_SHA"
          elif [[ "$RELEASE_TAG" == "$V0_5_2_RELEASE_TAG" ]]; then
            historical_source_sha="$V0_5_2_RELEASE_SOURCE_SHA"
          elif [[ "$RELEASE_TAG" == "$V0_5_3_RELEASE_TAG" ]]; then
            historical_source_sha="$V0_5_3_RELEASE_SOURCE_SHA"
          fi
          if [[ -n "$historical_source_sha" &&
                "$RELEASE_SOURCE_SHA" == "$historical_source_sha" ]]; then
            echo "$RELEASE_TAG source is the immutable release baseline"
            exit 0
          fi

          gh api --method POST \
            "repos/$REPOSITORY/actions/runs/$RELEASE_RUN_ID/cancel"
          gh api --method DELETE \
            "repos/$REPOSITORY/git/refs/tags/$RELEASE_TAG"
          echo "::error::$RELEASE_TAG source $RELEASE_SOURCE_SHA is not its immutable release baseline"
          exit 1
