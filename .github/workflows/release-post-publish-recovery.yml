name: Release post-publish recovery

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-post-publish-recovery-v0.5.0
  cancel-in-progress: false

jobs:
  verify-v0-5-0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Verify the immutable v0.5.0 public closure and recover its Agent host canary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-post-publish-recovery.sh
