name: v0.7.1 publication recovery

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-v071-publication-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: orchestration
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 26aacf9b839fd5ba9d824c2efcff2efc7084aec8
          path: source
          persist-credentials: false
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
      - name: Verify existing public bytes and record the owner-authorized recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: orchestration/scripts/recover-v071.sh source
