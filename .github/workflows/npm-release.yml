name: npm Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Bind the successful Release run to an immutable stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_REF" = "refs/tags/${RELEASE_TAG}"
          version="${RELEASE_TAG#v}"

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$RELEASE_SHA"
          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          test "$(jq -r '.object.type' <<<"$tag_ref")" = "tag"
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          test "$(jq -r '.object.type' <<<"$tag_object")" = "commit"
          test "$(jq -r '.object.sha' <<<"$tag_object")" = "$RELEASE_SHA"
          test "$(jq -r '.verification.signature != null' <<<"$tag_object")" = "true"
          case "$(jq -r '.verification.reason' <<<"$tag_object")" in
            valid|unknown_key|unverified_email) ;;
            *) echo "npm release requires a validly formed signed annotated tag" >&2; exit 1 ;;
          esac

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release")" = "false"
          test "$(jq -r '.prerelease' <<<"$release")" = "false"
          evidence="release-post-publish-evidence-${RELEASE_TAG}.json"
          evidence_assets="$(jq --arg name "$evidence" '[.assets[] | select(.name == $name and (.digest | startswith("sha256:")))]' <<<"$release")"
          test "$(jq 'length' <<<"$evidence_assets")" = "1"
          evidence_id="$(jq -r '.[0].id' <<<"$evidence_assets")"
          evidence_sha="$(jq -r '.[0].digest | sub("^sha256:"; "")' <<<"$evidence_assets")"
          [[ "$evidence_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$evidence_sha" =~ ^[0-9a-f]{64}$ ]]
          evidence_file="${RUNNER_TEMP}/${evidence}"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${evidence_id}" > "$evidence_file"
          test "$(sha256sum "$evidence_file" | awk '{print $1}')" = "$evidence_sha"

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$RELEASE_SHA" '
              .schema_version == "release-post-publish-evidence-v1" and
              .repository == $repository and
              .tag == $tag and
              .decision == "allow" and
              .candidate.commit == $sha and
              .release_workflow.head_sha == $sha and
              (.release_workflow.run_id | type == "number" and . > 0) and
              .release_workflow.url ==
                ("https://github.com/" + $repository + "/actions/runs/" +
                  (.release_workflow.run_id | tostring))
            ' "$evidence_file" >/dev/null
          release_run_id="$(jq -r '.release_workflow.run_id' "$evidence_file")"
          release_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${release_run_id}")"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg sha "$RELEASE_SHA" \
            --argjson run_id "$release_run_id" '
              .id == $run_id and
              .name == "Release" and
              .path == ".github/workflows/release.yml" and
              .event == "push" and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == $tag and
              .head_sha == $sha and
              .repository.full_name == $repository and
              .head_repository.full_name == $repository
            ' <<<"$release_run" >/dev/null

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - name: Download the five-target public native release closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          while read -r target extension; do
            base="depgraph-${RELEASE_VERSION}-${target}"
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --dir release-assets \
              --pattern "${base}.${extension}" \
              --pattern "${base}.${extension}.sha256" \
              --pattern "${base}.query-smoke.json" \
              --pattern "${base}.cross-language-smoke.json" \
              --pattern "${base}.mcp-smoke.json"
          done <<'TARGETS'
          aarch64-apple-darwin tar.gz
          x86_64-apple-darwin tar.gz
          aarch64-unknown-linux-gnu tar.gz
          x86_64-unknown-linux-gnu tar.gz
          x86_64-pc-windows-msvc zip
          TARGETS
      - name: Reverify public native packages and build the npm package set
        run: |
          set -euo pipefail
          cargo xtask verify-release-assets release-assets
          node npm/scripts/build-packages.mjs \
            --release-assets release-assets \
            --output npm-dist
      - name: Install the tarballs without lifecycle scripts and run the packaged Linux CLI
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          set -euo pipefail
          inventory=npm-dist/npm-package-set.json
          test "$(jq -r '.schema_version' "$inventory")" = "depgraph-npm-package-set-v1"
          meta="$(jq -r '.packages[] | select(.role == "root") | .tarball' "$inventory")"
          native="$(jq -r '.packages[] | select(.target == "x86_64-unknown-linux-gnu") | .tarball' "$inventory")"
          test -n "$meta"
          test -n "$native"
          smoke="${RUNNER_TEMP}/depgraph-npm-smoke"
          mkdir "$smoke"
          npm install \
            --prefix "$smoke" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --package-lock=false \
            "${GITHUB_WORKSPACE}/npm-dist/${native}" \
            "${GITHUB_WORKSPACE}/npm-dist/${meta}"
          test "$("${smoke}/node_modules/.bin/depgraph" --version)" = "depgraph ${RELEASE_VERSION}"
          "${smoke}/node_modules/.bin/depgraph-mcp" --version
          "${smoke}/node_modules/.bin/depgraph" \
            --store "${smoke}/store.sqlite" \
            scan "${GITHUB_WORKSPACE}/workers/web/test/fixtures/semantic-complete" \
            --json > "${smoke}/scan.json"
          jq -e '.status == "completed"' "${smoke}/scan.json" >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-set-${{ github.sha }}
          path: npm-dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: prepare
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-set-${{ github.sha }}
          path: npm-dist
      - name: Publish the verified platform packages before the CLI package
        shell: bash
        env:
          EXPECTED_RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          EXPECTED_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          inventory=npm-dist/npm-package-set.json
          jq -e \
            --arg tag "$EXPECTED_RELEASE_TAG" \
            --arg version "$EXPECTED_RELEASE_VERSION" '
              .schema_version == "depgraph-npm-package-set-v1" and
              .repository == "TamaT-LLC/depgraph-cli" and
              .release_tag == $tag and
              .release_version == $version and
              .npm_tag == "latest" and
              ([.packages[] | select(.role == "platform")] | length) == 5 and
              (.packages | map(.name)) == [
                "@tamat-llc/depgraph-darwin-arm64",
                "@tamat-llc/depgraph-darwin-x64",
                "@tamat-llc/depgraph-linux-arm64-gnu",
                "@tamat-llc/depgraph-linux-x64-gnu",
                "@tamat-llc/depgraph-win32-x64",
                "@tamat-llc/depgraph"
              ] and
              ([.packages[] | select(.role == "root" and .name == "@tamat-llc/depgraph")] | length) == 1 and
              .packages[-1].role == "root"
            ' "$inventory" >/dev/null

          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);
          ' "$npm_version"

          while IFS=$'\t' read -r package version tarball expected_sha expected_integrity; do
            file="npm-dist/${tarball}"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected_sha"
            package_json="$(tar -xOf "$file" package/package.json)"
            test "$(jq -r '.name' <<<"$package_json")" = "$package"
            test "$(jq -r '.version' <<<"$package_json")" = "$version"
            test "$(jq -r '.repository.url' <<<"$package_json")" = "git+https://github.com/TamaT-LLC/depgraph-cli.git"
            test "$(jq -r '.private // false' <<<"$package_json")" = "false"
            test "$(jq -r '.scripts // null' <<<"$package_json")" = "null"

            view_output="${RUNNER_TEMP}/npm-view.json"
            view_error="${RUNNER_TEMP}/npm-view.err"
            if npm view "${package}@${version}" dist.integrity repository.url --json >"$view_output" 2>"$view_error"; then
              test "$(jq -r '."dist.integrity" // .dist.integrity' "$view_output")" = "$expected_integrity"
              test "$(jq -r '."repository.url" // .repository.url' "$view_output")" = "git+https://github.com/TamaT-LLC/depgraph-cli.git"
              continue
            fi
            grep -q 'E404' "$view_error"
            npm publish "./${file}" --access public --tag latest --provenance

            published=false
            for attempt in {1..60}; do
              if npm view "${package}@${version}" dist.integrity --json >"$view_output" 2>"$view_error"; then
                actual_integrity="$(jq -er '.' "$view_output")"
                if test "$actual_integrity" != "$expected_integrity"; then
                  echo "published npm integrity differs for ${package}@${version}" >&2
                  exit 1
                fi
                published=true
                break
              fi
              if ! grep -q 'E404' "$view_error"; then
                cat "$view_error" >&2
                exit 1
              fi
              if test "$attempt" -lt 60; then
                echo "waiting for npm registry visibility: ${package}@${version} (${attempt}/60)" >&2
                sleep 30
              fi
            done
            if test "$published" != "true"; then
              echo "npm registry did not expose ${package}@${version} within 30 minutes" >&2
              exit 1
            fi
          done < <(jq -r '.packages[] | [.name, .version, .tarball, .sha256, .integrity] | @tsv' "$inventory")
