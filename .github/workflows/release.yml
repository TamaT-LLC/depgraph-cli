name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      # The full gate builds rust-analyzer twice (workspace tests and the
      # packaged semantic E2E). Disable incremental state and debug symbols so
      # both builds fit on the fixed-size hosted runner disk.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.93.1
      - name: Install the compiler-precise Linux namespace boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache-dependency-path: workers/go/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: cargo xtask test

  compiler-precise-hostile:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install the enforced Linux namespace boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Populate the locked dependency cache before network isolation
        run: cargo fetch --locked
      - name: Compiler-precise hostile execution and rollback E2E
        env:
          DEPGRAPH_COMPILER_HOSTILE_REPORT: dist/compiler-precise-hostile-e2e.json
        run: scripts/compiler-precise-hostile-e2e.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-precise-hostile-${{ github.sha }}
          path: dist/compiler-precise-hostile-e2e.json
          if-no-files-found: error

  benchmark:
    needs: quality
    runs-on: ubuntu-24.04
    env:
      # Product targets remain explicit report fields. Hosted-runner ceilings
      # bound regressions separately because Agent read tools deliberately
      # recompute from an immutable Store instead of mutating the impact cache.
      DEPGRAPH_SCAN_LIMIT_MS: "80000"
      DEPGRAPH_INCREMENTAL_LIMIT_MS: "10000"
      DEPGRAPH_QUERY_LIMIT_MS: "4000"
      DEPGRAPH_BOUNDED_QUERY_PLAN_LIMIT_MS: "7000"
      DEPGRAPH_BOUNDED_QUERY_EXECUTE_LIMIT_MS: "10000"
      DEPGRAPH_RUST_SCAN_LIMIT_MS: "12000"
      DEPGRAPH_RUST_NO_CACHE_SCAN_LIMIT_MS: "12000"
      DEPGRAPH_BUILD_OBSERVATION_LIMIT_MS: "60000"
      DEPGRAPH_BENCH_SAMPLES: "3"
      DEPGRAPH_QUERY_SAMPLES: "5"
      DEPGRAPH_NOISE_ALLOWANCE_PERCENT: "20"
      DEPGRAPH_ALLOWED_OUTLIERS: "1"
      DEPGRAPH_CACHE_HIT_MIN_IMPROVEMENT_PERCENT: "5"
      DEPGRAPH_BENCH_REPORT: "dist/benchmark-report.json"
      DEPGRAPH_CACHE_HIT_REPORT: "dist/cache-hit-benchmark-report.json"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache-dependency-path: workers/go/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: node --test scripts/tests/benchmark.test.mjs scripts/tests/cache-hit-benchmark.test.mjs
      - run: scripts/benchmark-mvp.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-report-${{ github.sha }}
          path: |
            dist/benchmark-report.json
            dist/cache-hit-benchmark-report.json
          if-no-files-found: error

  package:
    needs: [quality, compiler-precise-hostile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -C linker-features=-lld
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ""
          - os: macos-15
            target: aarch64-apple-darwin
            rustflags: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: ""
    runs-on: ${{ matrix.os }}
    env:
      # Match the tag-time x86_64 package linker to the exact-head Full CI
      # gate; other targets retain their platform defaults.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal --component rust-src
      - run: rustup default 1.93.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache-dependency-path: workers/go/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          standalone: false
      - name: Build archive and verify cross-adapter Build Evidence release gate
        env:
          DEPGRAPH_TARGET: ${{ matrix.target }}
        run: cargo xtask package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: depgraph-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.query-smoke.json
            dist/*.cross-language-smoke.json
            dist/*.mcp-smoke.json
          if-no-files-found: error

  verify-assets:
    needs: [package, benchmark]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: depgraph-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-report-${{ github.sha }}
          path: benchmark
      - name: Verify benchmark release artifact
        run: |
          node scripts/benchmark-report.mjs verify benchmark/benchmark-report.json
          node scripts/cache-hit-benchmark.mjs verify benchmark/cache-hit-benchmark-report.json
      - name: Verify five-target release asset closure
        run: cargo xtask verify-release-assets artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          path: artifacts/release-verification.json
          if-no-files-found: error

  compiler-pack:
    needs: [quality, compiler-precise-hostile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -C linker-features=-lld
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: ""
          - os: macos-15
            target: aarch64-apple-darwin
            rustflags: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: ""
    runs-on: ${{ matrix.os }}
    env:
      # The x86_64 compiler-pack smoke performs the same repeated host relinks
      # and must not re-enable the crashing Rust 1.93 self-contained linker.
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - name: Install the exact compiler-pack toolchain
        run: rustup toolchain install nightly-2026-07-17 --profile minimal --component rust-src,rustc-dev,llvm-tools-preview
      - name: Install the enforced Linux namespace boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Acquire the release-bound Rust channel manifest
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --output channel-rust-nightly-2026-07-17.toml \
            https://static.rust-lang.org/dist/2026-07-17/channel-rust-nightly.toml
      - name: Build, extract, attest, and exercise the target compiler pack
        env:
          DEPGRAPH_TARGET: ${{ matrix.target }}
        run: cargo xtask compiler-pack-package --channel-manifest channel-rust-nightly-2026-07-17.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-pack-${{ matrix.target }}
          path: |
            dist/depgraph-compiler-pack-*.tar.gz
            dist/depgraph-compiler-pack-*.zip
            dist/depgraph-compiler-pack-*.sha256
            dist/depgraph-compiler-pack-*.requirement.json
            dist/depgraph-compiler-pack-*.smoke.json
          if-no-files-found: error

  verify-compiler-packs:
    needs: compiler-pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: compiler-pack-*
          path: compiler-artifacts
          merge-multiple: true
      - name: Verify the compiler-pack five-target compatibility closure
        run: cargo xtask verify-compiler-pack-assets compiler-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-pack-verification
          path: compiler-artifacts/compiler-pack-verification.json
          if-no-files-found: error

  stable-gate:
    needs: [quality, compiler-precise-hostile, benchmark, package, verify-assets, compiler-pack, verify-compiler-packs]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-verification
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-report-${{ github.sha }}
          path: benchmark
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: compiler-pack-verification
          path: compiler-artifacts
      - name: Bind the stable candidate to main, release/0.5, and exact Full CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          api_source_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq '.tree.sha')"
          test "$source_tree" = "$api_source_tree"
          main_head_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$GITHUB_SHA" = "$main_head_sha"
          maintenance_head_sha="$GITHUB_SHA"
          if [[ "$GITHUB_REF_NAME" == "v0.5.3" ]]; then
            maintenance_head_sha="$(git ls-remote origin refs/heads/release/0.5 | awk '{print $1}')"
            test "$GITHUB_SHA" = "$maintenance_head_sha"
          fi

          gh run list --workflow CI --event workflow_dispatch --commit "$GITHUB_SHA" --status success --limit 100 \
            --json databaseId,headSha,headBranch,conclusion,event,url > artifacts/ci-runs.json
          ci_run_id="$(jq -r 'map(select(.headSha == env.GITHUB_SHA and .headBranch == "main")) | sort_by(.databaseId) | last | .databaseId // empty' artifacts/ci-runs.json)"
          test -n "$ci_run_id"
          gh run view "$ci_run_id" --json databaseId,headSha,headBranch,conclusion,event,url,jobs \
            | jq '{database_id:.databaseId,head_sha:.headSha,head_branch:.headBranch,event,conclusion,url,jobs:[.jobs[]|{name,conclusion}]}' \
            > artifacts/full-ci.json

          echo "DEPGRAPH_RELEASE_SOURCE_TREE=$source_tree" >> "$GITHUB_ENV"
          echo "DEPGRAPH_RELEASE_MAIN_HEAD_SHA=$main_head_sha" >> "$GITHUB_ENV"
          echo "DEPGRAPH_RELEASE_MAINTENANCE_HEAD_SHA=$maintenance_head_sha" >> "$GITHUB_ENV"
      - name: Evaluate the machine-readable v0.5 release gate
        env:
          DEPGRAPH_RELEASE_QUALITY_RESULT: ${{ needs.quality.result }}
          DEPGRAPH_RELEASE_COMPILER_PRECISE_HOSTILE_RESULT: ${{ needs.compiler-precise-hostile.result }}
          DEPGRAPH_RELEASE_BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          DEPGRAPH_RELEASE_PACKAGE_RESULT: ${{ needs.package.result }}
          DEPGRAPH_RELEASE_VERIFY_ASSETS_RESULT: ${{ needs.verify-assets.result }}
          DEPGRAPH_RELEASE_COMPILER_PACK_RESULT: ${{ needs.compiler-pack.result }}
          DEPGRAPH_RELEASE_VERIFY_COMPILER_PACKS_RESULT: ${{ needs.verify-compiler-packs.result }}
        run: >-
          cargo xtask stable-release-gate
          artifacts/release-verification.json
          benchmark/benchmark-report.json
          compiler-artifacts/compiler-pack-verification.json
          fixtures/agent-dogfood-v1/evidence/v0.5.0-rc.7/report.json
          artifacts/full-ci.json
          --output artifacts/stable-release-gate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: stable-release-gate
          path: artifacts/stable-release-gate.json
          if-no-files-found: error

  publish:
    needs: stable-gate
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify the signed annotated release tag
        id: signed-tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_ref_payload="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          test "$(jq -r '.ref' <<<"$tag_ref_payload")" = "refs/tags/${GITHUB_REF_NAME}"
          test "$(jq -r '.object.type' <<<"$tag_ref_payload")" = "tag"
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref_payload")"
          tag_payload="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
          test "$(jq -r '.object.type' <<<"$tag_payload")" = "commit"
          test "$(jq -r '.object.sha' <<<"$tag_payload")" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$GITHUB_SHA"
          if [[ "$GITHUB_REF_NAME" == "v0.5.3" ]]; then
            test "$(git ls-remote origin refs/heads/release/0.5 | awk '{print $1}')" = "$GITHUB_SHA"
          fi
          test "$(jq -r '.verification.signature != null' <<<"$tag_payload")" = "true"
          signature_verification="$(jq -r '.verification.reason' <<<"$tag_payload")"
          case "$signature_verification" in
            valid|unknown_key|unverified_email) ;;
            *) echo "release tag signature is not validly formed: $signature_verification" >&2; exit 1 ;;
          esac
          echo "tag_object_sha=$tag_object_sha" >> "$GITHUB_OUTPUT"
          echo "signature_verification=$signature_verification" >> "$GITHUB_OUTPUT"
      - name: Publish verified stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          args=(release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --notes-file "$notes" --verify-tag)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh "${args[@]}"
          fi
          release_metadata="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isPrerelease,body)"
          test "$(jq -r '.tagName' <<<"$release_metadata")" = "$GITHUB_REF_NAME"
          test "$(jq -r '.isDraft' <<<"$release_metadata")" = "false"
          test "$(jq -r '.body' <<<"$release_metadata")" = "$(cat "$notes")"
          expected_prerelease="false"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            expected_prerelease="true"
          fi
          test "$(jq -r '.isPrerelease' <<<"$release_metadata")" = "$expected_prerelease"
      - name: Re-download and attest the public release closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT_SHA: ${{ steps.signed-tag.outputs.tag_object_sha }}
          TAG_SIGNATURE_VERIFICATION: ${{ steps.signed-tag.outputs.signature_verification }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-rc.*}"
          test "$version" = "0.5.3"

          mkdir -p post-publish/public post-publish/normal post-publish/compiler post-publish/redownload
          gh release download "$GITHUB_REF_NAME" --dir post-publish/public
          evidence_name="release-post-publish-evidence-${GITHUB_REF_NAME}.json"
          if [[ -f "post-publish/public/${evidence_name}" ]]; then
            mv "post-publish/public/${evidence_name}" post-publish/existing-evidence.json
          fi

          normal_assets=(post-publish/public/depgraph-"${version}"-*)
          compiler_assets=(post-publish/public/depgraph-compiler-pack-"${version}"-*)
          test "${#normal_assets[@]}" -eq 25
          test "${#compiler_assets[@]}" -eq 20
          cp "${normal_assets[@]}" post-publish/normal/
          cp "${compiler_assets[@]}" post-publish/compiler/

          cargo xtask verify-release-assets post-publish/normal
          cargo xtask verify-compiler-pack-assets post-publish/compiler
          node scripts/benchmark-report.mjs verify post-publish/public/benchmark-report.json
          node scripts/cache-hit-benchmark.mjs verify post-publish/public/cache-hit-benchmark-report.json
          cmp --silent post-publish/normal/release-verification.json post-publish/public/release-verification.json
          cmp --silent post-publish/compiler/compiler-pack-verification.json post-publish/public/compiler-pack-verification.json
          cmp --silent artifacts/release-verification.json post-publish/public/release-verification.json
          cmp --silent artifacts/compiler-pack-verification.json post-publish/public/compiler-pack-verification.json
          cmp --silent artifacts/stable-release-gate.json post-publish/public/stable-release-gate.json

          ci_run_id="$(jq -r '.workflow_results.full_ci_run_id // empty' artifacts/stable-release-gate.json)"
          [[ "$ci_run_id" =~ ^[1-9][0-9]*$ ]]
          gh run view "$ci_run_id" --json databaseId,headSha,headBranch,conclusion,event,url,jobs \
            | jq '{database_id:.databaseId,head_sha:.headSha,head_branch:.headBranch,event,conclusion,url,jobs:[.jobs[]|{name,conclusion}]}' \
            > post-publish/full-ci.json

          source_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          evidence="post-publish/${evidence_name}"
          cargo xtask release-post-publish-evidence \
            artifacts \
            post-publish/public \
            post-publish/full-ci.json \
            --tag "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA" \
            --source-tree "$source_tree" \
            --tag-object-sha "$TAG_OBJECT_SHA" \
            --tag-signature-verification "$TAG_SIGNATURE_VERIFICATION" \
            --release-run-id "$GITHUB_RUN_ID" \
            --release-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output "$evidence"

          if [[ -f post-publish/existing-evidence.json ]]; then
            cmp --silent "$evidence" post-publish/existing-evidence.json
          else
            gh release upload "$GITHUB_REF_NAME" "$evidence"
          fi
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$evidence_name" \
            --dir post-publish/redownload
          cmp --silent "$evidence" "post-publish/redownload/$(basename "$evidence")"

          trusted_evidence_sha256="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            | jq -r --arg name "$evidence_name" '.assets[] | select(.name == $name) | .digest | sub("^sha256:"; "")')"
          test "${#trusted_evidence_sha256}" -eq 64

          scripts/release-post-publish-canary.sh \
            "$GITHUB_REF_NAME" \
            post-publish/public \
            "$evidence" \
            "$trusted_evidence_sha256" \
            workers/web/test/fixtures/polyglot \
            post-publish/canary

  mcp-repository-setup:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
            executable_suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: tar.gz
            executable_suffix: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
            executable_suffix: ""
          - os: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
            executable_suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
            executable_suffix: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise clean scoped MCP onboarding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPGRAPH_E2E_TARGET: ${{ matrix.target }}
          DEPGRAPH_E2E_EXTENSION: ${{ matrix.extension }}
          DEPGRAPH_E2E_EXECUTABLE_SUFFIX: ${{ matrix.executable_suffix }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="depgraph-${version}-${DEPGRAPH_E2E_TARGET}"
          archive="${package}.${DEPGRAPH_E2E_EXTENSION}"
          release_root="${RUNNER_TEMP}/depgraph-mcp-release"
          repository="${RUNNER_TEMP}/depgraph-mcp-repository"
          other_repository="${RUNNER_TEMP}/depgraph-mcp-other-repository"
          test_home="${RUNNER_TEMP}/depgraph-mcp-home"
          mkdir -p "$release_root" "$repository/src" "$other_repository/src" "$test_home/cache" "$test_home/local"
          gh release download "$GITHUB_REF_NAME" --pattern "$archive" --dir "$release_root"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            DEPGRAPH_ARCHIVE_PATH="$release_root/$archive" \
              DEPGRAPH_RELEASE_ROOT="$release_root" \
              pwsh -NoLogo -NoProfile -NonInteractive -Command \
                'Expand-Archive -LiteralPath $env:DEPGRAPH_ARCHIVE_PATH -DestinationPath $env:DEPGRAPH_RELEASE_ROOT'
          else
            tar -xf "$release_root/$archive" -C "$release_root"
          fi
          binary="$release_root/$package/bin/depgraph${DEPGRAPH_E2E_EXECUTABLE_SUFFIX}"
          test -x "$binary"

          git init --quiet --initial-branch=main "$repository"
          printf 'export const answer = 42;\n' > "$repository/src/index.ts"
          git init --quiet --initial-branch=main "$other_repository"
          printf 'export const answer = 43;\n' > "$other_repository/src/index.ts"
          export HOME="$test_home"
          export XDG_CACHE_HOME="$test_home/cache"
          export LOCALAPPDATA="$test_home/local"
          export APPDATA="$test_home/local"

          first="$("$binary" mcp setup --host codex --root "$repository")"
          printf '%s\n' "$first"
          grep -Fq 'artifacts: 0 reused, 6 downloaded' <<<"$first"
          test -f "$repository/.codex/config.toml"
          grep -Fq '[mcp_servers.depgraph]' "$repository/.codex/config.toml"

          second="$("$binary" mcp setup --host codex --root "$repository")"
          printf '%s\n' "$second"
          grep -Fq 'artifacts: 6 reused, 0 downloaded' <<<"$second"
          grep -Fq 'Codex config:' <<<"$second"
          grep -Fq '(unchanged)' <<<"$second"

          "$binary" mcp status --host codex --root "$repository"

          for host in claude cursor grok; do
            project_setup="$("$binary" mcp setup --host "$host" --root "$repository")"
            printf '%s\n' "$project_setup"
            grep -Fq 'artifacts: 6 reused, 0 downloaded' <<<"$project_setup"
            grep -Fq 'server name: depgraph' <<<"$project_setup"
            "$binary" mcp status --host "$host" --root "$repository"
          done

          for host in codex claude cursor grok; do
            user_setup="$("$binary" mcp setup --host "$host" --scope user --root "$repository")"
            printf '%s\n' "$user_setup"
            grep -Fq 'artifacts: 6 reused, 0 downloaded' <<<"$user_setup"
            user_server_line="$(grep -E '^server name: depgraph-[0-9a-f]{16}$' <<<"$user_setup")"
            user_setup_repeat="$("$binary" mcp setup --host "$host" --scope user --root "$repository")"
            repeat_user_server_line="$(grep -E '^server name: depgraph-[0-9a-f]{16}$' <<<"$user_setup_repeat")"
            test "$user_server_line" = "$repeat_user_server_line"
            if [[ "$host" == "codex" ]]; then
              repository_user_server_line="$user_server_line"
            fi
            "$binary" mcp status --host "$host" --scope user --root "$repository"
          done

          other_user_setup="$("$binary" mcp setup --host codex --scope user --root "$other_repository")"
          printf '%s\n' "$other_user_setup"
          grep -Fq 'artifacts: 6 reused, 0 downloaded' <<<"$other_user_setup"
          other_user_server_line="$(grep -E '^server name: depgraph-[0-9a-f]{16}$' <<<"$other_user_setup")"
          test "$repository_user_server_line" != "$other_user_server_line"
          "$binary" mcp status --host codex --scope user --root "$other_repository"

          other_removed="$("$binary" mcp uninstall --host codex --scope user --root "$other_repository")"
          printf '%s\n' "$other_removed"
          grep -Eq '^repository state files removed: [1-9][0-9]*$' <<<"$other_removed"
          if "$binary" mcp status --host codex --scope user --root "$other_repository"; then
            echo 'status unexpectedly succeeded after other repository state removal' >&2
            exit 1
          fi

          update="$("$binary" mcp update --host codex --root "$repository")"
          printf '%s\n' "$update"
          grep -Fq 'artifacts: 6 reused, 0 downloaded' <<<"$update"

          for host in claude cursor grok; do
            removed="$("$binary" mcp uninstall --host "$host" --root "$repository")"
            grep -Fq 'repository state was retained' <<<"$removed"
            "$binary" mcp status --host codex --root "$repository"
          done
          for host in codex claude cursor grok; do
            removed="$("$binary" mcp uninstall --host "$host" --scope user --root "$repository")"
            grep -Fq 'repository state was retained' <<<"$removed"
            "$binary" mcp status --host codex --root "$repository"
          done

          final_removed="$("$binary" mcp uninstall --host codex --root "$repository")"
          printf '%s\n' "$final_removed"
          grep -Eq '^repository state files removed: [1-9][0-9]*$' <<<"$final_removed"
          if grep -Fq '[mcp_servers.depgraph]' "$repository/.codex/config.toml"; then
            echo 'uninstall retained the repository-scoped depgraph entry' >&2
            exit 1
          fi
          if "$binary" mcp status --host codex --root "$repository"; then
            echo 'status unexpectedly succeeded after repository state removal' >&2
            exit 1
          fi
