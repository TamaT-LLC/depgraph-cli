name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.93.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: cargo xtask test

  benchmark:
    needs: quality
    runs-on: ubuntu-24.04
    env:
      # Product targets are enforced directly. Per-phase daemon traces make
      # regressions attributable without widening the latency contract.
      DEPGRAPH_SCAN_LIMIT_MS: "80000"
      DEPGRAPH_INCREMENTAL_LIMIT_MS: "2000"
      DEPGRAPH_QUERY_LIMIT_MS: "500"
      DEPGRAPH_BOUNDED_QUERY_PLAN_LIMIT_MS: "7000"
      DEPGRAPH_BOUNDED_QUERY_EXECUTE_LIMIT_MS: "10000"
      DEPGRAPH_BUILD_OBSERVATION_LIMIT_MS: "60000"
      DEPGRAPH_BENCH_SAMPLES: "3"
      DEPGRAPH_QUERY_SAMPLES: "5"
      DEPGRAPH_NOISE_ALLOWANCE_PERCENT: "20"
      DEPGRAPH_ALLOWED_OUTLIERS: "1"
      DEPGRAPH_BENCH_REPORT: "dist/benchmark-report.json"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - run: node --test scripts/tests/benchmark.test.mjs
      - run: scripts/benchmark-mvp.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-report-${{ github.sha }}
          path: dist/benchmark-report.json
          if-no-files-found: error

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.93.1 --profile minimal --component rust-src
      - run: rustup default 1.93.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - name: Build archive and verify cross-adapter Build Evidence release gate
        env:
          DEPGRAPH_TARGET: ${{ matrix.target }}
        run: cargo xtask package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: depgraph-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.query-smoke.json
            dist/*.cross-language-smoke.json
          if-no-files-found: error

  verify-assets:
    needs: [package, benchmark]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: depgraph-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: benchmark
      - name: Verify benchmark release artifact
        run: node scripts/benchmark-report.mjs verify benchmark/benchmark-report.json
      - name: Verify five-target release asset closure
        run: cargo xtask verify-release-assets artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-verification
          path: artifacts/release-verification.json
          if-no-files-found: error

  stable-gate:
    needs: [quality, benchmark, package, verify-assets]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-verification
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: benchmark
      - name: Evaluate the machine-readable stable v0.4.0 release gate
        env:
          DEPGRAPH_RELEASE_QUALITY_RESULT: ${{ needs.quality.result }}
          DEPGRAPH_RELEASE_BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          DEPGRAPH_RELEASE_PACKAGE_RESULT: ${{ needs.package.result }}
          DEPGRAPH_RELEASE_VERIFY_ASSETS_RESULT: ${{ needs.verify-assets.result }}
        run: cargo xtask stable-release-gate artifacts/release-verification.json benchmark/benchmark-report.json --output artifacts/stable-release-gate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stable-release-gate
          path: artifacts/stable-release-gate.json
          if-no-files-found: error

  publish:
    needs: stable-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          args=(release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --notes-file "$notes" --verify-tag)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
