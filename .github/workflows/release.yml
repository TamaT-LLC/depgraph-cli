name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.93.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: cargo xtask test

  benchmark:
    needs: quality
    runs-on: ubuntu-24.04
    env:
      # Shared hosted runners are materially slower than the development-machine
      # targets. Keep an explicit release ceiling while reporting the raw timings.
      DEPGRAPH_SCAN_LIMIT_MS: "60000"
      DEPGRAPH_QUERY_LIMIT_MS: "1500"
      DEPGRAPH_BUILD_OBSERVATION_LIMIT_MS: "60000"
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: scripts/benchmark-mvp.sh

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Build archive and verify cross-adapter Build Evidence release gate
        env:
          DEPGRAPH_TARGET: ${{ matrix.target }}
        run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: depgraph-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  verify-assets:
    needs: [package, benchmark]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify five-target release asset closure
        run: cargo xtask verify-release-assets artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: artifacts/release-verification.json
          if-no-files-found: error

  publish:
    needs: verify-assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified release candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          args=(release create "${GITHUB_REF_NAME}" artifacts/* --repo "${GITHUB_REPOSITORY}" --notes-file "$notes" --verify-tag)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
