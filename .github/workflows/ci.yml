name: Release API diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-api:
    runs-on: macos-15
    steps:
      - name: Compare anonymous and authenticated release metadata requests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl_bin="$(command -v curl)"
          printf 'curl executable: %s\n' "$curl_bin"
          "$curl_bin" --version
          url=https://api.github.com/repos/TamaT-LLC/depgraph-cli/releases/tags/v0.7.4
          env -i PATH="$(dirname "$curl_bin")" "$curl_bin" --disable --silent --show-error --location \
            --connect-timeout 30 --max-time 60 \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --user-agent depgraph-mcp-setup \
            --dump-header anonymous-headers.txt --output anonymous-body.json "$url"
          cat anonymous-headers.txt
          python3 - <<'PY'
          import json
          data=json.load(open('anonymous-body.json'))
          print(json.dumps({k:data.get(k) for k in ['message','documentation_url','tag_name']},indent=2))
          PY
          gh api repos/TamaT-LLC/depgraph-cli/releases/tags/v0.7.4 --jq '{tag_name,draft,prerelease}'
