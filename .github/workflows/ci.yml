name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.93.1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  go:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    defaults:
      run:
        working-directory: workers/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workers/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: workers/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  integration:
    needs: [rust, go, web]
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: cargo xtask build
      - name: Web end-to-end and deterministic export
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          target/debug/depgraph --store "$tmp/one.db" scan workers/web/test/fixtures/polyglot --json > "$tmp/scan.json"
          jq -e '.status == "completed" and .coverage.project_code_executed == false' "$tmp/scan.json"
          target/debug/depgraph --store "$tmp/one.db" export --format json > "$tmp/one.json"
          target/debug/depgraph --store "$tmp/two.db" scan workers/web/test/fixtures/polyglot --json > /dev/null
          target/debug/depgraph --store "$tmp/two.db" export --format json > "$tmp/two.json"
          jq -S '.graph | {nodes, sites, edges, coverage}' "$tmp/one.json" > "$tmp/one.graph.json"
          jq -S '.graph | {nodes, sites, edges, coverage}' "$tmp/two.json" > "$tmp/two.graph.json"
          diff -u "$tmp/one.graph.json" "$tmp/two.graph.json"
          test ! -e workers/web/test/fixtures/polyglot/apps/next-app/NEXT_CONFIG_EXECUTED
          test ! -e workers/web/test/fixtures/polyglot/apps/astro-app/ASTRO_CONFIG_EXECUTED
      - name: Go semantic end-to-end, determinism, and safe fallback
        run: cargo xtask go-semantic-e2e
      - name: Rust end-to-end and safe build capability inventory
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          fixture="workers/rust/tests/fixtures/security"
          target/debug/depgraph --store "$tmp/rust.db" scan "$fixture" --json > "$tmp/rust.json"
          jq -e '.status == "completed" and .coverage.dependency_sites > 0 and .coverage.project_code_executed == false' "$tmp/rust.json"
          test ! -e "$fixture/BUILD_SCRIPT_EXECUTED"
          test ! -e "$fixture/PROC_MACRO_EXECUTED"
          test ! -e "$fixture/CONFIG_EXECUTED"
      - name: Rust HIR semantic query, export, and determinism gate
        run: cargo xtask rust-semantic-e2e

  windows-smoke:
    needs: [rust, go, web]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: cargo test -p depgraph-rust-worker --lib --locked
      - run: cargo test -p depgraph-core --lib --locked web_worker_timeout_reaps_its_descendant_cross_platform
      - run: cargo xtask build
      - name: TypeScript compiler failure lifecycle
        working-directory: workers/web
        run: pnpm exec tsx --test --test-name-pattern="cross-platform compiler lifecycle" test/typescript-compiler.test.ts
      - run: target\debug\depgraph.exe --version
      - run: target\debug\depgraph-rust-worker.exe --version
      - run: workers\go\bin\depgraph-go-worker.exe --version
      - run: node workers\web\dist\worker.mjs --version
      - name: Web TypeChecker scaffold smoke
        shell: pwsh
        run: |
          $lines = node workers\web\dist\worker.mjs --root workers\web\test\fixtures\polyglot --scan-id windows-web-typechecker
          if ($LASTEXITCODE -ne 0) { throw "Web worker scan failed with exit $LASTEXITCODE" }
          $events = @($lines | ForEach-Object { $_ | ConvertFrom-Json })
          $profile = ($events | Where-Object event -eq 'profile_declared' | Select-Object -First 1).profile
          if ($profile.properties.typescript_project_model_status -ne 'ready') { throw 'TypeScript project model was not ready' }
          if ($profile.properties.typescript_typechecker_status -ne 'invoked-no-graph') { throw 'TypeChecker smoke did not run' }
          if ($profile.properties.typescript_release_gate -ne 'release-gate-pending') { throw 'Direct worker spoofed release attestation' }
          if ($profile.properties.typescript_semantic_graph_emission -ne 'disabled') { throw 'Semantic graph scaffold gate changed unexpectedly' }
          if (@($events | Where-Object { $_.edge.phase -eq 'semantic' }).Count -ne 0) { throw 'Scaffold emitted semantic edges' }
          $completed = ($events | Where-Object event -eq 'scan_completed' | Select-Object -Last 1).coverage
          if ($completed.completeness -contains 'semantic-complete') { throw 'Scaffold claimed semantic completeness' }
          if (Test-Path workers\web\test\fixtures\polyglot\apps\next-app\NEXT_CONFIG_EXECUTED) { throw 'Next config executed' }
          if (Test-Path workers\web\test\fixtures\polyglot\apps\astro-app\ASTRO_CONFIG_EXECUTED) { throw 'Astro config executed' }
      - run: cargo xtask go-semantic-e2e
      - run: cargo xtask rust-semantic-e2e
