name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: node --test npm/test/*.test.mjs scripts/tests/agent-dogfood.test.mjs scripts/tests/release-post-publish-canary.test.mjs
      - run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep separate from compiler-precise-hostile (different cargo profile / env).
          key: rust
      - name: Install the compiler-precise Linux namespace boundary
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  go:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    defaults:
      run:
        working-directory: workers/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache-dependency-path: workers/go/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: workers/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: workers/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  compiler-precise-hostile:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so pull_request path filtering can diff base..head.
          fetch-depth: 0
      - name: Decide whether compiler-precise-hostile must run
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -qE '^(Cargo\.(toml|lock)|crates/depgraph-core/|crates/depgraph-rustc-wrapper/|crates/depgraph-rustc-query/|crates/depgraph-cli/|crates/depgraph-store/|crates/depgraph-mcp/|crates/depgraph-mcp-tools/|crates/depgraph-operation/|xtask/src/compiler_pack_release\.rs|scripts/compiler-precise-hostile|docs/50_test/compiler-precise-hostile|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip compiler-precise-hostile when unrelated
        if: steps.decide.outputs.run != 'true'
        run: echo "Skipping compiler-precise-hostile (no relevant path changes)"
      - if: steps.decide.outputs.run == 'true'
        run: rustup toolchain install 1.93.1 --profile minimal
      - if: steps.decide.outputs.run == 'true'
        run: rustup default 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.decide.outputs.run == 'true'
        with:
          # Separate from rust job: CARGO_INCREMENTAL=0 and hostile e2e path.
          key: compiler-precise-hostile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: 24.18.0
      - name: Install the enforced Linux namespace boundary
        if: steps.decide.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Populate the locked dependency cache before network isolation
        if: steps.decide.outputs.run == 'true'
        run: cargo fetch --locked
      - name: Compiler-precise hostile execution and rollback E2E
        if: steps.decide.outputs.run == 'true'
        env:
          DEPGRAPH_COMPILER_HOSTILE_REPORT: dist/compiler-precise-hostile-e2e.json
        run: scripts/compiler-precise-hostile-e2e.sh
      - name: Decide whether the exact Linux compiler-pack smoke must run
        if: github.event_name == 'pull_request' && steps.decide.outputs.run == 'true'
        id: compiler-pack-smoke
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -qE '^(Cargo\.(toml|lock)|crates/depgraph-core/src/build\.rs|crates/depgraph-rustc-wrapper/|crates/depgraph-rustc-query/|xtask/src/compiler_pack_release\.rs|scripts/compiler-precise-hostile|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install the exact Linux compiler-pack toolchain
        if: steps.compiler-pack-smoke.outputs.run == 'true'
        run: rustup toolchain install nightly-2026-07-17 --profile minimal --component rust-src,rustc-dev,llvm-tools-preview
      - name: Acquire the release-bound Rust channel manifest
        if: steps.compiler-pack-smoke.outputs.run == 'true'
        run: |
          curl --fail --silent --show-error --location \
            --output channel-rust-nightly-2026-07-17.toml \
            https://static.rust-lang.org/dist/2026-07-17/channel-rust-nightly.toml
      - name: Exact Linux compiler-pack semantic release smoke
        if: steps.compiler-pack-smoke.outputs.run == 'true'
        env:
          DEPGRAPH_TARGET: x86_64-unknown-linux-gnu
          RUSTFLAGS: -C linker-features=-lld
        run: cargo xtask compiler-pack-package --channel-manifest channel-rust-nightly-2026-07-17.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.decide.outputs.run == 'true'
        with:
          name: compiler-precise-hostile-${{ github.sha }}
          path: dist/compiler-precise-hostile-e2e.json
          if-no-files-found: error

  benchmark:
    needs: [rust, go, web]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      # Product targets remain explicit report fields. Hosted-runner ceilings
      # bound regressions separately because Agent read tools deliberately
      # recompute from an immutable Store instead of mutating the impact cache.
      DEPGRAPH_SCAN_LIMIT_MS: "80000"
      DEPGRAPH_INCREMENTAL_LIMIT_MS: "10000"
      DEPGRAPH_QUERY_LIMIT_MS: "4000"
      DEPGRAPH_BOUNDED_QUERY_PLAN_LIMIT_MS: "7000"
      DEPGRAPH_BOUNDED_QUERY_EXECUTE_LIMIT_MS: "10000"
      DEPGRAPH_RUST_SCAN_LIMIT_MS: "12000"
      DEPGRAPH_RUST_NO_CACHE_SCAN_LIMIT_MS: "12000"
      DEPGRAPH_BUILD_OBSERVATION_LIMIT_MS: "60000"
      DEPGRAPH_BENCH_SAMPLES: "3"
      DEPGRAPH_QUERY_SAMPLES: "5"
      DEPGRAPH_NOISE_ALLOWANCE_PERCENT: "20"
      DEPGRAPH_ALLOWED_OUTLIERS: "1"
      DEPGRAPH_CACHE_HIT_MIN_IMPROVEMENT_PERCENT: "5"
      DEPGRAPH_BENCH_REPORT: "dist/benchmark-report.json"
      DEPGRAPH_CACHE_HIT_REPORT: "dist/cache-hit-benchmark-report.json"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache-dependency-path: workers/go/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - run: node --test scripts/tests/benchmark.test.mjs scripts/tests/cache-hit-benchmark.test.mjs scripts/tests/agent-dogfood.test.mjs
      - run: scripts/benchmark-mvp.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-report-${{ github.sha }}
          path: |
            dist/benchmark-report.json
            dist/cache-hit-benchmark-report.json
          if-no-files-found: error

  integration:
    needs: [rust, go, web]
    if: github.event_name == 'workflow_dispatch'
    strategy:
      # Preserve the successful platform evidence when the other matrix leg
      # fails so a transient/native failure cannot erase its diagnostics.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            # Rust 1.93 enables its self-contained rust-lld by default on this
            # target. Repeated large debug relinks crash that linker with
            # SIGBUS on ubuntu-24.04, so use rustc's stable opt-out and the
            # runner's system linker for the entire job/fingerprint.
            rustflags: -C linker-features=-lld
          - os: macos-15
            target: aarch64-apple-darwin
            rustflags: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      # This job repeatedly rebuilds the rust-analyzer-heavy debug graph before
      # its isolated release package. Bound intermediate state so the hosted
      # runner cannot exhaust its fixed disk before Rust semantic verification.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal --component rust-src
      - run: rustup default 1.93.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache-dependency-path: workers/go/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install the compiler-precise Linux namespace boundary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Build supervisor staging, redaction, timeout, cancellation, and descendant reap
        run: cargo test -p depgraph-core --lib --locked build::tests
      - name: Watcher daemon lifecycle, debounce, cancellation, and recovery
        run: cargo test -p depgraph-core --lib --locked daemon::tests
      - run: cargo xtask build
      - name: Web semantic import/type/call end-to-end and deterministic export
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          depgraph_bin="$PWD/target/debug/depgraph"
          target/debug/depgraph --store "$tmp/one.db" scan workers/web/test/fixtures/polyglot --json > "$tmp/scan.json"
          jq -e '.status == "completed" and .coverage.project_code_executed == false' "$tmp/scan.json"
          (
            cd "$tmp"
            "$depgraph_bin" --store one.db export --format json --output one.json
          )
          jq -e '.graph as $graph
            | [$graph.evidence[] | select(
                .owner_type == "site" and .ordinal == 0 and .kind == "semantic"
                and .extractor == "typescript-native-typechecker" and .extractor_version == "7.0.2"
              )] as $semantic_site_evidence
            | [$semantic_site_evidence[].owner_id] | unique as $semantic_site_ids
            | [$graph.evidence[] | select(
                .owner_type == "edge" and .ordinal == 0 and .kind == "semantic"
                and .extractor == "typescript-native-typechecker" and .extractor_version == "7.0.2"
              ) | .owner_id] | unique as $semantic_edge_ids
            | [$graph.sites[] | select(.id as $id | $semantic_site_ids | index($id))] as $semantic_sites
            | [$semantic_sites[] | select(.kind == "call")] as $call_sites
            | [$graph.edges[] | select(.id as $id | $semantic_edge_ids | index($id))] as $semantic_edges
            | [$semantic_edges[] | select(.site_id == null)] as $definition_edges
            | [$semantic_edges[] | select(.site_id != null)] as $dependency_edges
            | [$graph.nodes[] | select(.kind == "symbol" or .kind == "type")] as $semantic_nodes
            | ($graph.profiles | any(.properties.typescript_analysis_mode == "semantic-import-type-call-graph"
              and .properties.typescript_project_model_status == "ready"
              and .properties.typescript_typechecker_status == "definition-import-type-call-graph-emitted"
              and .properties.typescript_definition_graph_status == "ready"
              and .properties.typescript_semantic_graph_emission == "definition-import-type-call-graph-v2"
              and .properties.typescript_semantic_issue_count == "0"
              and (.properties.typescript_semantic_node_count | tonumber) == ($semantic_nodes | length)
              and (.properties.typescript_semantic_relation_count | tonumber) == ($semantic_edges | length)
              and (.properties.typescript_semantic_site_count | tonumber) == ($semantic_sites | length)
              and (.properties.typescript_semantic_call_site_count | tonumber) == ($call_sites | length)))
            and ($graph.nodes | any(.kind == "symbol"))
            and ($graph.nodes | any(.kind == "type" and .properties.type_kind == "generic_instance"))
            and ([$definition_edges[].kind] | unique | sort
              == ["declares", "extends", "implements", "instantiates"])
            and ([$dependency_edges[].kind] | unique | sort == ["calls", "imports", "may_call", "reexports", "type_uses"])
            and ([$semantic_sites[].kind] | unique | sort == ["call", "type_use", "web_import", "web_reexport"])
            and ($semantic_sites | all(
              .resolution_status == "resolved" or .resolution_status == "candidates"
              or .resolution_status == "external" or .resolution_status == "unresolved"
            ))
            and ($semantic_sites | any(.resolution_status == "resolved"))
            and ($semantic_sites | any(.resolution_status == "candidates"))
            and ($semantic_sites | any(.resolution_status == "external"))
            and ($semantic_sites | any(.resolution_status == "unresolved"))
            and ($semantic_site_evidence | any(.properties.type_only == true))
            and ($semantic_site_evidence | any(.properties.type_only == false))
            and ($definition_edges | all(.resolution_status == "resolved" and .precision == "exact"))
            and ($semantic_sites | all(
              . as $site
              | ([$graph.evidence[] | select(
                  .owner_type == "site" and .owner_id == $site.id and .ordinal == 0
                )] | first) as $primary
              | [$graph.edges[] | select(.site_id == $site.id)] as $linked
              | ([$linked[].condition] | unique_by(tojson) | sort_by(tojson)) as $edge_conditions
              | $primary != null
                and (if $site.kind == "call" then
                  (["call_expression", "new_expression", "tagged_template"]
                    | index($primary.properties.occurrence_kind))
                  and (["function", "method", "constructor", "tagged_template"]
                    | index($primary.properties.call_kind))
                  and (["direct", "static", "private", "fresh_instance", "super", "external", "dynamic", "open"]
                    | index($primary.properties.dispatch))
                  and ($primary.properties | has("type_only") | not)
                  and ($primary.properties | has("imported_name") | not)
                  and ($primary.properties | has("resolution_mode") | not)
                  and (if ($primary.properties | has("module_specifier")) then
                    ($primary.properties.module_specifier | type == "string")
                  else true end)
                  and (if $site.resolution_status == "candidates" then
                    $site.precision == "overapprox"
                    and $site.reason == null
                    and (($primary.properties.dispatch == "dynamic"
                          and $primary.properties.algorithm == "typescript-closed-local-call-flow-v1")
                      or ($primary.properties.dispatch == "fresh_instance"
                          and $primary.properties.algorithm == "typescript-closed-local-fresh-instance-flow-v1"))
                  else
                    ($primary.properties | has("algorithm") | not)
                  end)
                else
                  ($primary.properties.type_only | type == "boolean")
                  and (if $site.kind == "web_import" then
                    (["named_import", "default_import", "namespace_import", "side_effect_import", "empty_import",
                      "import_equals", "require_call", "dynamic_import", "import_type"]
                      | index($primary.properties.occurrence_kind))
                  elif $site.kind == "web_reexport" then
                    (["named_reexport", "namespace_reexport", "empty_reexport", "export_star"]
                      | index($primary.properties.occurrence_kind))
                  else
                    (["type_reference", "heritage_type", "jsdoc_type"]
                      | index($primary.properties.occurrence_kind))
                  end)
                  and (if $site.kind == "type_use"
                      or $primary.properties.occurrence_kind == "import_type" then
                    $primary.properties.type_only == true
                  elif (["side_effect_import", "require_call", "dynamic_import"]
                      | index($primary.properties.occurrence_kind)) then
                    $primary.properties.type_only == false
                  else true end)
                  and (if $site.kind == "type_use" then
                    ($primary.properties.imported_name | type == "string")
                    and $primary.properties.imported_name == $site.specifier
                  else
                    ($primary.properties.module_specifier | type == "string")
                    and $primary.properties.module_specifier == $site.specifier
                  end)
                  and (if $site.kind == "type_use" then
                    ($primary.properties.imported_name | type == "string")
                  elif (["default_import", "named_import", "named_reexport"]
                      | index($primary.properties.occurrence_kind)) then
                    ($primary.properties.imported_name | type == "string")
                  elif (["namespace_import", "namespace_reexport"]
                      | index($primary.properties.occurrence_kind)) then
                    $primary.properties.imported_name == "*"
                  elif $primary.properties.occurrence_kind == "import_equals" then
                    $primary.properties.imported_name == "="
                  else ($primary.properties | has("imported_name") | not) end)
                  and (if ($primary.properties | has("resolution_mode")) then
                    ($primary.properties.resolution_mode == "import"
                      or $primary.properties.resolution_mode == "require")
                    and $primary.properties.type_only == true
                    and ($primary.properties.module_specifier | type == "string")
                    and $primary.properties.occurrence_kind != "import_equals"
                  else true end)
                end)
                and ($site.target_ids | length) > 0
                and $site.target_ids == ($site.target_ids | sort)
                and ($linked | length) == ($site.target_ids | length)
                and (if ($edge_conditions | length) == 1 then
                  $site.condition == $edge_conditions[0]
                else $site.condition.op == "any" end)
                and ($linked | all(
                  .source == $site.source
                  and .profile_id == $site.profile_id
                  and .resolution_status == $site.resolution_status
                  and .precision == $site.precision
                  and (.target as $target | $site.target_ids | index($target))
                  and .kind == (if $site.kind == "web_import" then "imports"
                    elif $site.kind == "web_reexport" then "reexports"
                    elif $site.kind == "type_use" then "type_uses"
                    elif $site.resolution_status == "candidates" then "may_call" else "calls" end)
                ))
                and (if $site.resolution_status == "resolved" then
                  ($site.target_ids | length) == 1 and $site.precision == "exact"
                elif $site.resolution_status == "candidates" then $site.precision == "overapprox"
                elif $site.resolution_status == "external" then
                  ($site.target_ids | length) == 1 and ($site.precision == "exact" or $site.precision == "heuristic")
                else
                  ($site.target_ids | length) == 1 and $site.precision == "heuristic"
                  and ($site.reason | type == "string" and length > 0)
                end)
                and (if $site.resolution_status == "external" then
                  ($site.target_ids | all(. as $target
                    | $graph.nodes | any(
                      .id == $target and .kind == "external_system"
                      and .properties.language == "typescript"
                      and .properties.profile_id == $site.profile_id
                      and .properties.compiler_version == "7.0.2"
                      and .properties.external == true and (.properties.workspace != true)
                    )))
                elif $site.resolution_status == "unresolved" then
                  ($site.target_ids | all(. as $target
                    | $graph.nodes | any(
                      .id == $target and .kind == "unknown_target"
                      and .properties.language == "web"
                      and .properties.profile_id == $site.profile_id
                    )))
                elif $site.kind == "call" then
                  ($site.target_ids | all(. as $target
                    | $graph.nodes | any(.id == $target and .kind == "symbol")))
                elif $site.kind == "type_use" then
                  ($site.target_ids | all(. as $target
                    | $graph.nodes | any(.id == $target and .kind == "type")))
                else true end)
                and (if ((["namespace_import", "side_effect_import", "empty_import", "import_equals",
                    "require_call", "dynamic_import", "import_type", "namespace_reexport", "empty_reexport", "export_star"]
                    | index($primary.properties.occurrence_kind))
                    and ($site.resolution_status == "resolved" or $site.resolution_status == "candidates")) then
                  ($site.target_ids | all(. as $target
                    | $graph.nodes | any(.id == $target and .kind == "file")))
                else true end)
                and (if ($site.target_ids | any(. as $target
                  | $graph.nodes | any(.id == $target and .kind == "file"))) then
                  (["namespace_import", "side_effect_import", "import_equals", "require_call", "dynamic_import",
                    "empty_import", "import_type", "namespace_reexport", "empty_reexport", "export_star"]
                    | index($primary.properties.occurrence_kind))
                else true end)
            ))
            and ($semantic_site_evidence | any(.properties.occurrence_kind == "empty_import"))
            and ($semantic_site_evidence | any(.properties.occurrence_kind == "empty_reexport"))
            and ($semantic_edges | all(. as $edge | $graph.evidence | any(
              .owner_type == "edge" and .owner_id == $edge.id and .ordinal == 0 and .kind == "semantic"
              and .extractor == "typescript-native-typechecker" and .extractor_version == "7.0.2")))
            and ($graph.edges | any(.phase == "source" and (.kind == "imports" or .kind == "reexports")))
            and $graph.coverage.dependency_sites == ($graph.sites | length)
            and $graph.coverage.dependency_sites == (
              $graph.coverage.resolved + $graph.coverage.candidates
              + $graph.coverage.external + $graph.coverage.unresolved
            )
            and ($graph.coverage.completeness | index("semantic-complete") | not)
            and ($graph.profiles | any(
              (.features | length) > 0
              and .properties.web_framework_completeness_capability == "framework-semantic-completeness-v1"
              and .properties.web_framework_completeness_status == "incomplete"
              and ((.properties.web_framework_completeness_ledger | fromjson) as $ledger
                | ($ledger | length) == (.features | length)
                and ($ledger | all(.status == "incomplete" and (.reasons | length) > 0)))
            ))
            and ($graph.coverage.reasons | index("framework_semantic_incomplete"))
          ' "$tmp/one.json"
          jq -e '.graph as $graph
            | [$graph.sites[] as $site
              | select($site.kind == "call")
              | ([$graph.evidence[] | select(
                  .owner_type == "site" and .owner_id == $site.id and .ordinal == 0
                  and .kind == "semantic" and .extractor == "typescript-native-typechecker"
                )] | first) as $primary
              | {site: $site, primary: $primary, linked: [$graph.edges[] | select(.site_id == $site.id)]}
            ] as $calls
            | ($graph.edges | any(.phase == "semantic" and .kind == "may_call"))
              and ($calls | any(
                .primary.path == "apps/shared/src/calls.ts"
                and .site.specifier == "directTarget"
                and .site.resolution_status == "resolved" and .site.precision == "exact"
                and .primary.properties.call_kind == "function"
                and .primary.properties.dispatch == "direct"
              ))
              and ($calls | any(
                .primary.path == "apps/shared/src/calls.ts"
                and .site.specifier == "DirectReceiver"
                and .site.resolution_status == "resolved" and .site.precision == "exact"
                and .primary.properties.call_kind == "constructor"
                and .primary.properties.dispatch == "direct"
              ))
              and ($calls | any(
                .primary.path == "apps/shared/src/calls.ts"
                and .site.resolution_status == "resolved" and .site.precision == "exact"
                and .primary.properties.call_kind == "method"
                and (.primary.properties.dispatch as $dispatch
                  | ["static", "private", "fresh_instance", "super"] | index($dispatch))
              ))
              and ($calls | any(
                .primary.path == "apps/shared/src/calls.ts"
                and .site.specifier == "value.trim" and .site.resolution_status == "external"
                and .primary.properties.dispatch == "external"
              ))
              and ($calls | any(
                .primary.path == "apps/shared/src/calls.ts"
                and .site.specifier == "dynamicTarget" and .site.resolution_status == "candidates"
                and .site.precision == "overapprox" and .site.reason == null
                and .primary.properties.dispatch == "dynamic"
                and .primary.properties.algorithm == "typescript-closed-local-call-flow-v1"
              ))
              and ($calls | any(
                .primary.path == "apps/shared/src/calls.ts"
                and .site.specifier == "candidateReceiver.closedMethod" and .site.resolution_status == "candidates"
                and .site.precision == "overapprox" and .site.reason == null
                and .primary.properties.dispatch == "fresh_instance"
                and .primary.properties.algorithm == "typescript-closed-local-fresh-instance-flow-v1"
              ))
              and ($calls | any(
                . as $call
                | .primary.path == "apps/shared/src/calls.ts"
                and .site.specifier == "conditionalTarget" and .site.resolution_status == "candidates"
                and .site.precision == "overapprox" and .site.reason == null
                and (.site.target_ids | length) == 2
                and .site.target_ids == (.site.target_ids | sort)
                and .primary.properties.dispatch == "dynamic"
                and .primary.properties.algorithm == "typescript-closed-local-call-flow-v1"
                and ($call.linked | length) == 2
                and ($call.linked | all(
                  . as $edge
                  | .kind == "may_call" and .site_id == $call.site.id
                    and .resolution_status == "candidates" and .precision == "overapprox"
                    and (.target as $target | $call.site.target_ids | index($target))
                    and ($graph.evidence | any(
                      .owner_type == "edge" and .owner_id == $edge.id and .ordinal == 0
                      and .kind == "semantic" and .extractor == "typescript-native-typechecker"
                      and .properties.algorithm == "typescript-closed-local-call-flow-v1"
                    ))
                ))
              ))
          ' "$tmp/one.json"
          jq -e '.graph as $graph
            | [$graph.evidence[] | select(
                .owner_type == "site" and .ordinal == 0 and .kind == "semantic"
                and .extractor == "typescript-native-typechecker" and .extractor_version == "7.0.2"
                and .properties.module_specifier == "node:fs"
                and .properties.type_only == false
              ) | .owner_id] as $builtin_site_ids
            | [$graph.sites[] | select(
                .kind == "web_import" and .specifier == "node:fs"
                and (.id as $id | $builtin_site_ids | index($id))
              )] as $builtin_sites
            | ($builtin_sites | length) > 0
              and ($builtin_sites | all(
                .resolution_status == "external" and .precision == "exact"
                and (.reason == null) and (.target_ids | length) == 1
                and (.target_ids[0] as $target | $graph.nodes | any(
                  .id == $target and .kind == "external_system"
                  and .locator == "external://typescript/node%3Afs"
                  and .display_name == "node:fs"
                  and .properties.canonical_identity == {
                    "language":"typescript",
                    "compiler_version":"7.0.2",
                    "locator":"node:fs"
                  }
                ))
              ))
          ' "$tmp/one.json"
          target/debug/depgraph --store "$tmp/one.db" deps 'type:definition:["package","npm:workspace:@fixture/shared@1.0.0#apps/shared","definition:[\"module\",\"type\",\"apps/shared/src/semantic.ts\",[\"SharedStringCollection\"]]"]' --all --json > "$tmp/deps.json"
          jq -e '.data.steps as $steps
            | ([$steps[].edge.kind] | unique) as $kinds
            | (["extends", "implements", "instantiates"]
                | all(. as $kind | $kinds | index($kind)))
              and ($steps | all(.edge.phase == "semantic" and .evidence[0].kind == "semantic"))' "$tmp/deps.json"
          semantic_source="$(jq -r '[.graph.edges[] | select(
            .phase == "semantic" and .kind == "calls" and .resolution_status == "resolved"
          )][0].source // empty' "$tmp/one.json")"
          test -n "$semantic_source"
          target/debug/depgraph --store "$tmp/one.db" deps "id:$semantic_source" --all --json > "$tmp/semantic-deps-one.json"
          jq -e '.data.steps | any(
            .edge.phase == "semantic"
            and .edge.kind == "calls" and .edge.resolution_status == "resolved"
            and (.evidence | any(.kind == "semantic" and .extractor == "typescript-native-typechecker"))
          )' "$tmp/semantic-deps-one.json"
          semantic_unresolved_id="$(jq -r '.graph as $graph
            | [$graph.evidence[] | select(.owner_type == "site" and .kind == "semantic") | .owner_id] as $semantic_ids
            | [$graph.sites[] | select(
                .kind == "call" and .resolution_status == "unresolved"
                and (.id as $id | $semantic_ids | index($id))
              )][0].id // empty' "$tmp/one.json")"
          test -n "$semantic_unresolved_id"
          target/debug/depgraph --store "$tmp/one.db" unresolved --all --json > "$tmp/unresolved.json"
          jq -e --arg id "$semantic_unresolved_id" '.data | any(
            .site.id == $id
            and (.site.reason | type == "string" and length > 0)
            and (.evidence | any(.kind == "semantic" and .extractor == "typescript-native-typechecker"))
          )' "$tmp/unresolved.json"
          target/debug/depgraph --store "$tmp/semantic-complete.db" scan workers/web/test/fixtures/semantic-complete --json > "$tmp/semantic-complete-scan.json"
          jq -e '.status == "completed"
            and .coverage.project_code_executed == false
            and (.coverage.completeness | index("syntax-complete"))
            and (.coverage.completeness | index("semantic-complete"))
            and .coverage.unresolved == 0
            and (.coverage.reasons | length == 0)
            and .coverage.candidates > 0
            and .coverage.external > 0' "$tmp/semantic-complete-scan.json"
          (
            cd "$tmp"
            "$depgraph_bin" --store semantic-complete.db export --format json --output semantic-complete.json
          )
          jq -e '.graph as $graph
            | ($graph.profiles | any(
                (.features | length) == 0
                and .properties.typescript_typechecker_status == "definition-import-type-call-graph-emitted"
                and .properties.typescript_definition_graph_status == "ready"
                and .properties.typescript_semantic_graph_emission == "definition-import-type-call-graph-v2"
                and .properties.typescript_semantic_diagnostics == "0"
                and .properties.typescript_emitted_semantic_diagnostics == "0"
                and .properties.typescript_semantic_issue_count == "0"
                and .properties.project_code_executed == "false"
              ))
            and ($graph.sites | any(.resolution_status == "candidates"))
            and ($graph.sites | any(.resolution_status == "external"))' "$tmp/semantic-complete.json"
          cp -R workers/web/test/fixtures/polyglot "$tmp/checkout-two"
          target/debug/depgraph --store "$tmp/two.db" scan "$tmp/checkout-two" --json > /dev/null
          (
            cd "$tmp"
            "$depgraph_bin" --store two.db export --format json --output two.json
          )
          jq -S '.graph' "$tmp/one.json" > "$tmp/one.graph.json"
          jq -S '.graph' "$tmp/two.json" > "$tmp/two.graph.json"
          diff -u "$tmp/one.graph.json" "$tmp/two.graph.json"
          target/debug/depgraph --store "$tmp/two.db" deps "id:$semantic_source" --all --json > "$tmp/semantic-deps-two.json"
          jq -S '.data' "$tmp/semantic-deps-one.json" > "$tmp/semantic-deps-one.data.json"
          jq -S '.data' "$tmp/semantic-deps-two.json" > "$tmp/semantic-deps-two.data.json"
          diff -u "$tmp/semantic-deps-one.data.json" "$tmp/semantic-deps-two.data.json"
          for format in dot mermaid; do
            target/debug/depgraph --store "$tmp/one.db" export --format "$format" > "$tmp/one.$format"
            target/debug/depgraph --store "$tmp/two.db" export --format "$format" > "$tmp/two.$format"
            diff -u "$tmp/one.$format" "$tmp/two.$format"
          done
          test ! -e workers/web/test/fixtures/polyglot/apps/next-app/NEXT_CONFIG_EXECUTED
          test ! -e workers/web/test/fixtures/polyglot/apps/astro-app/ASTRO_CONFIG_EXECUTED
      - name: Go semantic end-to-end, determinism, and safe fallback
        run: cargo xtask go-semantic-e2e
      - name: Rust end-to-end and safe build capability inventory
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          fixture="workers/rust/tests/fixtures/security"
          target/debug/depgraph --store "$tmp/rust.db" scan "$fixture" --json > "$tmp/rust.json"
          jq -e '.status == "completed" and .coverage.dependency_sites > 0 and .coverage.project_code_executed == false' "$tmp/rust.json"
          test ! -e "$fixture/BUILD_SCRIPT_EXECUTED"
          test ! -e "$fixture/PROC_MACRO_EXECUTED"
          test ! -e "$fixture/CONFIG_EXECUTED"
      - name: Reclaim integration build artifacts before the isolated Rust semantic gate
        run: cargo clean
      - name: Rust HIR semantic query, export, and determinism gate
        run: cargo xtask rust-semantic-e2e
      - name: Reclaim integration build artifacts before the isolated package gate
        run: cargo clean
      - name: Packaged semantic and cross-adapter Build Evidence archive gate
        env:
          DEPGRAPH_TARGET: ${{ matrix.target }}
        run: cargo xtask package

  # Temporary branch-only regression probe for Windows CRLF checkout behavior.
  # Remove after project metadata verification passes on windows-2025.
  windows-metadata-crlf-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - name: Verify release workflow metadata after a Windows checkout
        run: cargo test -p xtask --locked repository_release_metadata_is_synchronized

  windows-smoke:
    needs: [rust, go, web]
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.93.1 --profile minimal --component rust-src
      - run: rustup default 1.93.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.1
          cache-dependency-path: workers/go/go.sum
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Build supervisor staging, redaction, timeout, cancellation, and descendant reap
        run: cargo test -p depgraph-core --lib --locked build::tests
      - name: Watcher daemon lifecycle, debounce, cancellation, and recovery
        run: cargo test -p depgraph-core --lib --locked daemon::tests
      - name: Repository path confinement and snapshot pinning
        run: |
          cargo test -p depgraph-core --test service --locked
          cargo test -p depgraph-core --lib --locked service_repository::tests
      - run: cargo test -p depgraph-rust-worker --lib --locked
      - run: cargo test -p depgraph-core --lib --locked web_worker_timeout_reaps_its_descendant_cross_platform
      - run: cargo xtask build
      - name: Release metadata and LF-normalized project licenses
        run: cargo test -p xtask --locked repository_release_metadata_is_synchronized
      - name: TypeScript compiler failure lifecycle
        working-directory: workers/web
        run: pnpm exec tsx --test --test-name-pattern="cross-platform compiler lifecycle" test/typescript-compiler.test.ts
      - run: target\debug\depgraph.exe --version
      - run: target\debug\depgraph-rust-worker.exe --version
      - run: workers\go\bin\depgraph-go-worker.exe --version
      - run: node workers\web\dist\worker.mjs --version
      - name: Reclaim smoke build artifacts before the isolated package gate
        run: cargo clean
      - name: Packaged cross-adapter Build Evidence archive gate
        env:
          DEPGRAPH_TARGET: x86_64-pc-windows-msvc
        run: cargo xtask package
      - name: Web TypeChecker import, type-use, and exact-call graph smoke
        shell: pwsh
        run: |
          $lines = node workers\web\dist\worker.mjs --root workers\web\test\fixtures\polyglot --scan-id windows-web-typechecker
          if ($LASTEXITCODE -ne 0) { throw "Web worker scan failed with exit $LASTEXITCODE" }
          $events = @($lines | ForEach-Object { $_ | ConvertFrom-Json })
          $profile = ($events | Where-Object event -eq 'profile_declared' | Select-Object -First 1).profile
          if ($profile.properties.typescript_project_model_status -ne 'ready') { throw 'TypeScript project model was not ready' }
          if ($profile.properties.typescript_analysis_mode -ne 'semantic-import-type-call-graph') { throw 'TypeChecker analysis capability changed unexpectedly' }
          if ($profile.properties.typescript_typechecker_status -ne 'definition-import-type-call-graph-emitted') { throw 'TypeChecker import/type/call graph did not run' }
          if ($profile.properties.typescript_definition_graph_status -ne 'ready') { throw 'TypeChecker definition graph was not ready' }
          if ($profile.properties.typescript_semantic_issue_count -ne '0') { throw 'TypeChecker import/type/call graph reported semantic issues' }
          if ($profile.properties.typescript_release_gate -ne 'release-gate-pending') { throw 'Direct worker spoofed release attestation' }
          if ($profile.properties.typescript_semantic_graph_emission -ne 'definition-import-type-call-graph-v2') { throw 'Semantic graph emission capability changed unexpectedly' }
          $semanticNodes = @($events | Where-Object { $_.node.kind -eq 'symbol' -or $_.node.kind -eq 'type' })
          $nodeKinds = @{}
          $nodesById = @{}
          $events | Where-Object { $null -ne $_.node.id } | ForEach-Object {
            $nodeKinds[$_.node.id] = $_.node.kind
            $nodesById[$_.node.id] = $_.node
          }
          $semanticEdges = @($events | Where-Object {
            $_.edge.phase -eq 'semantic' -and
            $_.edge.evidence[0].kind -eq 'semantic' -and
            $_.edge.evidence[0].extractor -eq 'typescript-native-typechecker' -and
            $_.edge.evidence[0].extractor_version -eq '7.0.2'
          })
          $definitionEdges = @($semanticEdges | Where-Object { $null -eq $_.edge.site_id })
          $dependencyEdges = @($semanticEdges | Where-Object { $null -ne $_.edge.site_id })
          $semanticSites = @($events | Where-Object {
            $_.event -eq 'dependency_site' -and
            $_.site.evidence[0].kind -eq 'semantic' -and
            $_.site.evidence[0].extractor -eq 'typescript-native-typechecker' -and
            $_.site.evidence[0].extractor_version -eq '7.0.2'
          } | ForEach-Object { $_.site })
          $callSites = @($semanticSites | Where-Object kind -eq 'call')
          if ($semanticNodes.Count -eq 0) { throw 'Definition graph emitted no semantic nodes' }
          if ($semanticSites.Count -eq 0) { throw 'Import/type/call graph emitted no semantic sites' }
          if ($dependencyEdges.Count -eq 0) { throw 'Import/type/call graph emitted no semantic dependency edges' }
          if ([int]$profile.properties.typescript_semantic_node_count -ne $semanticNodes.Count) { throw 'Semantic node count drifted' }
          if ([int]$profile.properties.typescript_semantic_relation_count -ne $semanticEdges.Count) { throw 'Semantic relation count drifted' }
          if ([int]$profile.properties.typescript_semantic_site_count -ne $semanticSites.Count) { throw 'Semantic site count drifted' }
          if ([int]$profile.properties.typescript_semantic_call_site_count -ne $callSites.Count) { throw 'Semantic call-site count drifted' }
          $definitionKinds = @($definitionEdges | ForEach-Object { $_.edge.kind } | Sort-Object -Unique)
          if (($definitionKinds -join ',') -ne 'declares,extends,implements,instantiates') { throw "Definition relation kinds drifted: $($definitionKinds -join ',')" }
          $dependencyKinds = @($dependencyEdges | ForEach-Object { $_.edge.kind } | Sort-Object -Unique)
          if (($dependencyKinds -join ',') -ne 'calls,imports,may_call,reexports,type_uses') { throw "Semantic dependency kinds drifted: $($dependencyKinds -join ',')" }
          $siteKinds = @($semanticSites | ForEach-Object { $_.kind } | Sort-Object -Unique)
          if (($siteKinds -join ',') -ne 'call,type_use,web_import,web_reexport') { throw "Semantic site kinds drifted: $($siteKinds -join ',')" }
          $statuses = @($semanticSites | ForEach-Object { $_.resolution_status } | Sort-Object -Unique)
          $unexpectedStatuses = @($statuses | Where-Object { $_ -notin @('resolved', 'candidates', 'external', 'unresolved') })
          if ($unexpectedStatuses.Count -ne 0 -or $statuses -notcontains 'resolved' -or $statuses -notcontains 'candidates' -or
              $statuses -notcontains 'external' -or $statuses -notcontains 'unresolved') {
            throw "Semantic site statuses drifted: $($statuses -join ',')"
          }
          $typeOnlyValues = @($semanticSites | Where-Object kind -ne 'call' | ForEach-Object { $_.evidence[0].properties.type_only })
          if (($typeOnlyValues | Where-Object { $_ -isnot [bool] }).Count -ne 0 -or
              $typeOnlyValues -notcontains $true -or $typeOnlyValues -notcontains $false) {
            throw 'Semantic type_only evidence markers are missing or not boolean'
          }
          foreach ($site in $semanticSites) {
            $linked = @($dependencyEdges | Where-Object { $_.edge.site_id -eq $site.id })
            if ($linked.Count -ne $site.target_ids.Count) { throw "Semantic site/edge cardinality drifted for $($site.id)" }
            if (($site.target_ids -join ',') -ne (($site.target_ids | Sort-Object) -join ',')) { throw "Semantic targets are not sorted for $($site.id)" }
            $expectedKind = if ($site.kind -eq 'web_import') { 'imports' } elseif ($site.kind -eq 'web_reexport') { 'reexports' } elseif ($site.kind -eq 'type_use') { 'type_uses' } elseif ($site.resolution_status -eq 'candidates') { 'may_call' } else { 'calls' }
            $occurrenceKind = $site.evidence[0].properties.occurrence_kind
            $typeOnly = $site.evidence[0].properties.type_only
            $allowedOccurrences = switch ($site.kind) {
              'web_import' { @('named_import', 'default_import', 'namespace_import', 'side_effect_import', 'empty_import', 'import_equals', 'require_call', 'dynamic_import', 'import_type') }
              'web_reexport' { @('named_reexport', 'namespace_reexport', 'empty_reexport', 'export_star') }
              'type_use' { @('type_reference', 'heritage_type', 'jsdoc_type') }
              'call' { @('call_expression', 'new_expression', 'tagged_template') }
              default { @() }
            }
            if ($occurrenceKind -notin $allowedOccurrences) {
              throw "Occurrence kind $occurrenceKind is incompatible with $($site.kind): $($site.id)"
            }
            $evidenceProperties = $site.evidence[0].properties
            $evidencePropertyNames = @($evidenceProperties.PSObject.Properties.Name)
            if ($site.kind -eq 'call') {
              if ($evidencePropertyNames -contains 'type_only' -or
                  $evidencePropertyNames -contains 'imported_name' -or
                  $evidencePropertyNames -contains 'resolution_mode' -or
                  $evidenceProperties.call_kind -notin @('function', 'method', 'constructor', 'tagged_template') -or
                  $evidenceProperties.dispatch -notin @('direct', 'static', 'private', 'fresh_instance', 'super', 'external', 'dynamic', 'open') -or
                  ($evidencePropertyNames -contains 'module_specifier' -and $evidenceProperties.module_specifier -isnot [string]) -or
                  ($site.resolution_status -eq 'candidates' -and (
                    $site.precision -ne 'overapprox' -or $null -ne $site.reason -or
                    -not (($evidenceProperties.dispatch -eq 'dynamic' -and $evidenceProperties.algorithm -eq 'typescript-closed-local-call-flow-v1') -or
                          ($evidenceProperties.dispatch -eq 'fresh_instance' -and $evidenceProperties.algorithm -eq 'typescript-closed-local-fresh-instance-flow-v1'))
                  )) -or
                  ($site.resolution_status -ne 'candidates' -and $evidencePropertyNames -contains 'algorithm') -or
                  $nodeKinds[$site.source] -ne 'symbol') {
                throw "Call metadata drifted for $($site.id)"
              }
            } else {
              if (($site.kind -eq 'type_use' -or $occurrenceKind -eq 'import_type') -and -not $typeOnly) {
                throw "Type-only semantic occurrence omitted type_only=true: $($site.id)"
              }
              if ($occurrenceKind -in @('side_effect_import', 'require_call', 'dynamic_import') -and $typeOnly) {
                throw "Runtime semantic occurrence reported type_only=true: $($site.id)"
              }
              if ($site.kind -eq 'type_use') {
                if ($evidenceProperties.imported_name -isnot [string] -or
                    $evidenceProperties.imported_name -ne $site.specifier) {
                  throw "Type-use binding metadata drifted for $($site.id)"
                }
              } elseif ($evidenceProperties.module_specifier -isnot [string] -or
                        $evidenceProperties.module_specifier -ne $site.specifier) {
                throw "Import/re-export module metadata drifted for $($site.id)"
              }
              if ($site.kind -ne 'type_use' -and $occurrenceKind -in @('default_import', 'named_import', 'named_reexport') -and
                  $evidenceProperties.imported_name -isnot [string]) {
                throw "Named binding metadata is missing for $($site.id)"
              }
              if ($occurrenceKind -in @('namespace_import', 'namespace_reexport') -and
                  $evidenceProperties.imported_name -ne '*') {
                throw "Namespace binding metadata drifted for $($site.id)"
              }
              if ($occurrenceKind -eq 'import_equals' -and $evidenceProperties.imported_name -ne '=') {
                throw "Import-equals binding metadata drifted for $($site.id)"
              }
              if ($occurrenceKind -in @('side_effect_import', 'empty_import', 'require_call', 'dynamic_import', 'import_type', 'empty_reexport', 'export_star') -and
                  $evidencePropertyNames -contains 'imported_name') {
                throw "Module-only occurrence reported imported_name for $($site.id)"
              }
              if ($evidencePropertyNames -contains 'resolution_mode') {
                if ($evidenceProperties.resolution_mode -notin @('import', 'require') -or
                    -not $typeOnly -or $evidenceProperties.module_specifier -isnot [string] -or
                    $occurrenceKind -eq 'import_equals') {
                  throw "Resolution-mode evidence metadata drifted for $($site.id)"
                }
              }
            }
            $siteCondition = $site.condition | ConvertTo-Json -Compress -Depth 32
            $conditionSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $linked | ForEach-Object {
              [void]$conditionSet.Add(($_.edge.condition | ConvertTo-Json -Compress -Depth 32))
            }
            $edgeConditionJson = @($conditionSet)
            [Array]::Sort($edgeConditionJson, [System.StringComparer]::Ordinal)
            if ($edgeConditionJson.Count -eq 1 -and $edgeConditionJson[0] -ne $siteCondition) {
              throw "Single-target semantic site condition differs from its edge for $($site.id)"
            }
            foreach ($edgeEvent in $linked) {
              $edge = $edgeEvent.edge
              if ($edge.kind -ne $expectedKind -or $edge.source -ne $site.source -or
                  $edge.profile_id -ne $site.profile_id -or
                  $edge.resolution_status -ne $site.resolution_status -or $edge.precision -ne $site.precision -or
                  -not ($site.target_ids -contains $edge.target) -or $edge.evidence[0].kind -ne 'semantic') {
                throw "Semantic site/edge contract drifted for $($site.id)"
              }
            }
            switch ($site.resolution_status) {
              'resolved' {
                if ($site.target_ids.Count -ne 1 -or $site.precision -ne 'exact') {
                  throw "Resolved semantic site cardinality/precision drifted for $($site.id)"
                }
              }
              'candidates' {
                if ($site.precision -ne 'overapprox') { throw "Candidate precision drifted for $($site.id)" }
              }
              'external' {
                if ($site.target_ids.Count -ne 1 -or $site.precision -notin @('exact', 'heuristic')) {
                  throw "External semantic site cardinality/precision drifted for $($site.id)"
                }
              }
              'unresolved' {
                if ($site.target_ids.Count -ne 1 -or $site.precision -ne 'heuristic' -or
                    [string]::IsNullOrWhiteSpace($site.reason)) {
                  throw "Unresolved semantic site contract drifted for $($site.id)"
                }
              }
            }
            foreach ($target in $site.target_ids) {
              if (-not $nodeKinds.ContainsKey($target)) { throw "Semantic target node was not emitted: $target" }
              $targetNode = $nodesById[$target]
              if ($site.resolution_status -eq 'external' -and
                  ($targetNode.kind -ne 'external_system' -or $targetNode.properties.language -ne 'typescript' -or
                   $targetNode.properties.profile_id -ne $site.profile_id -or
                   $targetNode.properties.compiler_version -ne '7.0.2' -or
                   $targetNode.properties.external -ne $true -or $targetNode.properties.workspace -eq $true)) {
                throw "External semantic site targeted an invalid sentinel: $target"
              }
              if ($site.resolution_status -eq 'unresolved' -and
                  ($targetNode.kind -ne 'unknown_target' -or $targetNode.properties.language -ne 'web' -or
                   $targetNode.properties.profile_id -ne $site.profile_id)) {
                throw "Unresolved semantic site targeted an invalid sentinel: $target"
              }
              if ($site.kind -eq 'type_use' -and $site.resolution_status -in @('resolved', 'candidates') -and
                  $nodeKinds[$target] -ne 'type') {
                throw "Concrete type-use site targeted $($nodeKinds[$target])"
              }
              if ($site.kind -eq 'call' -and $site.resolution_status -in @('resolved', 'candidates') -and
                  $nodeKinds[$target] -ne 'symbol') {
                throw "Concrete call site targeted $($nodeKinds[$target])"
              }
              if ($occurrenceKind -in @(
                    'namespace_import', 'side_effect_import', 'empty_import', 'import_equals', 'require_call',
                    'dynamic_import', 'import_type', 'namespace_reexport', 'empty_reexport', 'export_star'
                  ) -and
                  $site.resolution_status -in @('resolved', 'candidates') -and $nodeKinds[$target] -ne 'file') {
                throw "Module-level site targeted $($nodeKinds[$target]): $($site.id)"
              }
              if ($targetNode.kind -eq 'file' -and
                  $site.evidence[0].properties.occurrence_kind -notin @(
                    'namespace_import', 'side_effect_import', 'import_equals', 'require_call', 'dynamic_import',
                    'empty_import', 'import_type', 'namespace_reexport', 'empty_reexport', 'export_star'
                  )) {
                throw "Named semantic binding was weakened to a file target: $($site.id)"
              }
            }
          }
          $fixtureCalls = @($callSites | Where-Object { $_.evidence[0].path -eq 'apps/shared/src/calls.ts' })
          if (-not ($fixtureCalls | Where-Object {
              $_.specifier -eq 'directTarget' -and $_.resolution_status -eq 'resolved' -and $_.precision -eq 'exact' -and
              $_.evidence[0].properties.call_kind -eq 'function' -and $_.evidence[0].properties.dispatch -eq 'direct'
            })) { throw 'Call fixture omitted exact direct function call' }
          if (-not ($fixtureCalls | Where-Object {
              $_.specifier -eq 'DirectReceiver' -and $_.resolution_status -eq 'resolved' -and $_.precision -eq 'exact' -and
              $_.evidence[0].properties.call_kind -eq 'constructor' -and $_.evidence[0].properties.dispatch -eq 'direct'
            })) { throw 'Call fixture omitted exact constructor call' }
          if (-not ($fixtureCalls | Where-Object {
              $_.resolution_status -eq 'resolved' -and $_.precision -eq 'exact' -and
              $_.evidence[0].properties.call_kind -eq 'method' -and
              $_.evidence[0].properties.dispatch -in @('static', 'private', 'fresh_instance', 'super')
            })) { throw 'Call fixture omitted exact method call' }
          if (-not ($fixtureCalls | Where-Object {
              $_.specifier -eq 'value.trim' -and $_.resolution_status -eq 'external' -and
              $_.evidence[0].properties.dispatch -eq 'external'
            })) { throw 'Call fixture omitted external call ledger entry' }
          if (-not ($fixtureCalls | Where-Object {
              $_.specifier -eq 'dynamicTarget' -and $_.resolution_status -eq 'candidates' -and
              $_.precision -eq 'overapprox' -and $null -eq $_.reason -and
              $_.evidence[0].properties.dispatch -eq 'dynamic' -and
              $_.evidence[0].properties.algorithm -eq 'typescript-closed-local-call-flow-v1'
            })) { throw 'Call fixture omitted closed local function candidate' }
          if (-not ($fixtureCalls | Where-Object {
              $_.specifier -eq 'candidateReceiver.closedMethod' -and $_.resolution_status -eq 'candidates' -and
              $_.precision -eq 'overapprox' -and $null -eq $_.reason -and
              $_.evidence[0].properties.dispatch -eq 'fresh_instance' -and
              $_.evidence[0].properties.algorithm -eq 'typescript-closed-local-fresh-instance-flow-v1'
            })) { throw 'Call fixture omitted closed fresh-instance candidate' }
          $multipleCandidateCalls = @($fixtureCalls | Where-Object {
              $_.specifier -eq 'conditionalTarget' -and $_.resolution_status -eq 'candidates' -and
              $_.precision -eq 'overapprox' -and $null -eq $_.reason -and $_.target_ids.Count -eq 2 -and
              $_.evidence[0].properties.dispatch -eq 'dynamic' -and
              $_.evidence[0].properties.algorithm -eq 'typescript-closed-local-call-flow-v1'
            })
          if ($multipleCandidateCalls.Count -ne 1) { throw 'Call fixture omitted two-target closed local candidate' }
          $multipleCandidate = $multipleCandidateCalls[0]
          if (($multipleCandidate.target_ids -join ',') -ne (($multipleCandidate.target_ids | Sort-Object) -join ',')) {
            throw 'Two-target candidate targets were not sorted'
          }
          $multipleCandidateEdges = @($dependencyEdges | Where-Object { $_.edge.site_id -eq $multipleCandidate.id })
          if ($multipleCandidateEdges.Count -ne 2 -or ($multipleCandidateEdges | Where-Object {
                $_.edge.kind -ne 'may_call' -or $_.edge.site_id -ne $multipleCandidate.id -or
                $_.edge.resolution_status -ne 'candidates' -or $_.edge.precision -ne 'overapprox' -or
                $_.edge.target -notin $multipleCandidate.target_ids -or
                $_.edge.evidence[0].properties.algorithm -ne 'typescript-closed-local-call-flow-v1'
              })) {
            throw 'Two-target candidate lost same-site may_call edges or algorithm provenance'
          }
          if (-not ($semanticEdges | Where-Object { $_.edge.kind -eq 'may_call' })) {
            throw 'Web candidate-call slice omitted may_call edges'
          }
          if (-not ($semanticSites | Where-Object { $_.evidence[0].properties.occurrence_kind -eq 'empty_import' })) {
            throw 'Semantic sites omitted empty_import acceptance fixture'
          }
          if (-not ($semanticSites | Where-Object { $_.evidence[0].properties.occurrence_kind -eq 'empty_reexport' })) {
            throw 'Semantic sites omitted empty_reexport acceptance fixture'
          }
          $builtinSites = @($semanticSites | Where-Object {
            $_.kind -eq 'web_import' -and $_.specifier -eq 'node:fs' -and
            $_.evidence[0].properties.module_specifier -eq 'node:fs' -and
            $_.evidence[0].properties.type_only -eq $false
          })
          if ($builtinSites.Count -eq 0) { throw 'Semantic sites omitted the node:fs builtin acceptance fixture' }
          foreach ($site in $builtinSites) {
            $target = $nodesById[$site.target_ids[0]]
            $identity = $target.properties.canonical_identity
            $identityFields = @($identity.PSObject.Properties.Name | Sort-Object)
            if ($site.resolution_status -ne 'external' -or $site.precision -ne 'exact' -or
                $site.target_ids.Count -ne 1 -or $null -ne $site.reason -or
                $target.kind -ne 'external_system' -or $target.locator -ne 'external://typescript/node%3Afs' -or
                $target.display_name -ne 'node:fs' -or
                ($identityFields -join ',') -ne 'compiler_version,language,locator' -or
                $identity.language -ne 'typescript' -or $identity.compiler_version -ne '7.0.2' -or
                $identity.locator -ne 'node:fs') {
              throw "node:fs import lost its exact canonical builtin identity: $($site.id)"
            }
          }
          $sourceDependencyEdges = @($events | Where-Object {
            $_.edge.phase -eq 'source' -and ($_.edge.kind -eq 'imports' -or $_.edge.kind -eq 'reexports')
          })
          if ($sourceDependencyEdges.Count -eq 0) { throw 'Semantic union overwrote the source import graph' }
          $completed = ($events | Where-Object event -eq 'scan_completed' | Select-Object -Last 1).coverage
          if ($completed.completeness -contains 'semantic-complete') { throw 'Import/type/call slice claimed semantic completeness' }
          $frameworkReasons = @($completed.reasons)
          $frameworkLedger = @($profile.properties.web_framework_completeness_ledger | ConvertFrom-Json)
          if ($profile.features.Count -eq 0 -or
              $profile.properties.web_framework_completeness_capability -ne 'framework-semantic-completeness-v1' -or
              $profile.properties.web_framework_completeness_status -ne 'incomplete' -or
              $frameworkLedger.Count -ne $profile.features.Count -or
              @($frameworkLedger | Where-Object { $_.status -ne 'incomplete' -or @($_.reasons).Count -eq 0 }).Count -ne 0 -or
              $frameworkReasons -notcontains 'framework_semantic_incomplete') {
            throw 'Framework fixture lost its bounded completeness ledger'
          }
          $semanticCompleteLines = node workers\web\dist\worker.mjs --root workers\web\test\fixtures\semantic-complete --scan-id windows-web-semantic-complete
          if ($LASTEXITCODE -ne 0) { throw "Pure TypeScript worker scan failed with exit $LASTEXITCODE" }
          $semanticCompleteEvents = @($semanticCompleteLines | ForEach-Object { $_ | ConvertFrom-Json })
          $semanticCompleteProfile = ($semanticCompleteEvents | Where-Object event -eq 'profile_declared' | Select-Object -First 1).profile
          $semanticCompleteCoverage = ($semanticCompleteEvents | Where-Object event -eq 'scan_completed' | Select-Object -Last 1).coverage
          $semanticCompleteStatuses = @($semanticCompleteEvents | Where-Object event -eq 'dependency_site' | ForEach-Object { $_.site.resolution_status })
          if ($semanticCompleteCoverage.completeness -notcontains 'syntax-complete' -or
              $semanticCompleteCoverage.completeness -notcontains 'semantic-complete' -or
              $semanticCompleteCoverage.project_code_executed -ne $false -or
              $semanticCompleteCoverage.unresolved -ne 0 -or
              @($semanticCompleteCoverage.reasons).Count -ne 0 -or
              $semanticCompleteProfile.features.Count -ne 0 -or
              $semanticCompleteProfile.properties.typescript_semantic_diagnostics -ne '0' -or
              $semanticCompleteProfile.properties.typescript_emitted_semantic_diagnostics -ne '0' -or
              $semanticCompleteStatuses -notcontains 'candidates' -or
              $semanticCompleteStatuses -notcontains 'external') {
            throw 'Pure TypeScript fixture did not satisfy the semantic-complete contract'
          }
          $frameworkCompleteLines = node workers\web\dist\worker.mjs --root workers\web\test\fixtures\framework-complete --scan-id windows-web-framework-complete
          if ($LASTEXITCODE -ne 0) { throw "Framework-complete worker scan failed with exit $LASTEXITCODE" }
          $frameworkCompleteEvents = @($frameworkCompleteLines | ForEach-Object { $_ | ConvertFrom-Json })
          $frameworkCompleteProfile = ($frameworkCompleteEvents | Where-Object event -eq 'profile_declared' | Select-Object -First 1).profile
          $frameworkCompleteCoverage = ($frameworkCompleteEvents | Where-Object event -eq 'scan_completed' | Select-Object -Last 1).coverage
          $frameworkCompleteLedger = @($frameworkCompleteProfile.properties.web_framework_completeness_ledger | ConvertFrom-Json)
          $dynamicFrameworkSites = @($frameworkCompleteEvents | Where-Object {
            $_.event -eq 'dependency_site' -and $_.site.resolution_status -eq 'unresolved' -and $_.site.reason -eq 'function_value_dispatch'
          })
          if (($frameworkCompleteProfile.features -join ',') -ne 'astro,next,tanstack-router,tanstack-start' -or
              $frameworkCompleteProfile.properties.web_framework_completeness_status -ne 'complete' -or
              $frameworkCompleteProfile.properties.web_framework_completeness_issue_count -ne '0' -or
              $frameworkCompleteLedger.Count -ne 4 -or
              @($frameworkCompleteLedger | Where-Object { $_.status -ne 'complete' -or @($_.reasons).Count -ne 0 }).Count -ne 0 -or
              $frameworkCompleteCoverage.completeness -contains 'semantic-complete' -or
              @($frameworkCompleteCoverage.reasons) -contains 'framework_semantic_incomplete' -or
              $dynamicFrameworkSites.Count -eq 0) {
            throw 'Mixed framework fixture lost its complete ledger or dynamic-boundary gate'
          }
          $isolatedParent = Join-Path $env:RUNNER_TEMP "depgraph-web-framework-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $isolatedParent | Out-Null
          $frameworkCases = @(
            [pscustomobject]@{ Framework = 'astro'; App = 'astro'; SemanticComplete = $true },
            [pscustomobject]@{ Framework = 'next'; App = 'next'; SemanticComplete = $true },
            [pscustomobject]@{ Framework = 'tanstack-router'; App = 'router'; SemanticComplete = $false },
            [pscustomobject]@{ Framework = 'tanstack-start'; App = 'start'; SemanticComplete = $false }
          )
          foreach ($case in $frameworkCases) {
            $isolatedRoot = Join-Path $isolatedParent $case.App
            Copy-Item workers\web\test\fixtures\framework-complete $isolatedRoot -Recurse
            Get-ChildItem (Join-Path $isolatedRoot 'apps') -Directory |
              Where-Object Name -ne $case.App |
              Remove-Item -Recurse -Force
            if ($case.Framework -in @('astro', 'next')) {
              Remove-Item (Join-Path $isolatedRoot 'packages') -Recurse -Force
            }
            $caseLines = node workers\web\dist\worker.mjs --root $isolatedRoot --scan-id "windows-$($case.App)-complete"
            if ($LASTEXITCODE -ne 0) { throw "$($case.Framework) worker scan failed with exit $LASTEXITCODE" }
            $caseEvents = @($caseLines | ForEach-Object { $_ | ConvertFrom-Json })
            $caseProfile = ($caseEvents | Where-Object event -eq 'profile_declared' | Select-Object -First 1).profile
            $caseCoverage = ($caseEvents | Where-Object event -eq 'scan_completed' | Select-Object -Last 1).coverage
            $caseLedger = @($caseProfile.properties.web_framework_completeness_ledger | ConvertFrom-Json)
            $caseEdges = @($caseEvents | Where-Object {
              $_.edge.phase -eq 'semantic' -and
              $_.edge.evidence[0].kind -eq 'semantic' -and
              $_.edge.evidence[0].properties.framework -eq $case.Framework -and
              $_.edge.evidence[0].properties.contract_version -eq 'framework-semantic-graph-v1'
            })
            $hasSemanticComplete = @($caseCoverage.completeness) -contains 'semantic-complete'
            if (($caseProfile.features -join ',') -ne $case.Framework -or
                $caseProfile.properties.web_framework_completeness_status -ne 'complete' -or
                $caseLedger.Count -ne 1 -or $caseLedger[0].framework -ne $case.Framework -or
                $caseLedger[0].status -ne 'complete' -or @($caseLedger[0].reasons).Count -ne 0 -or
                $caseCoverage.project_code_executed -ne $false -or
                $hasSemanticComplete -ne $case.SemanticComplete -or
                @($caseCoverage.reasons) -contains 'framework_semantic_incomplete' -or
                $caseEdges.Count -eq 0) {
              throw "$($case.Framework) fixture lost its isolated semantic capability or safety gate"
            }
          }
          $secondRoot = Join-Path $isolatedParent 'mixed-checkout-two'
          Copy-Item workers\web\test\fixtures\framework-complete $secondRoot -Recurse
          $frameworkCompleteLinesTwo = node workers\web\dist\worker.mjs --root $secondRoot --scan-id windows-web-framework-complete-two
          if ($LASTEXITCODE -ne 0) { throw "Second framework-complete worker scan failed with exit $LASTEXITCODE" }
          $normalizeEvents = {
            param([object[]]$eventLines)
            @($eventLines | ForEach-Object {
              $eventObject = $_ | ConvertFrom-Json
              $eventObject.PSObject.Properties.Remove('scan_id')
              if ($eventObject.event -eq 'scan_started') {
                $eventObject.PSObject.Properties.Remove('root')
              }
              $eventObject | ConvertTo-Json -Compress -Depth 100
            }) -join "`n"
          }
          if ((& $normalizeEvents $frameworkCompleteLines) -cne (& $normalizeEvents $frameworkCompleteLinesTwo)) {
            throw 'Mixed framework events changed across checkout-equivalent roots'
          }
          if (Test-Path workers\web\test\fixtures\polyglot\apps\next-app\NEXT_CONFIG_EXECUTED) { throw 'Next config executed' }
          if (Test-Path workers\web\test\fixtures\polyglot\apps\astro-app\ASTRO_CONFIG_EXECUTED) { throw 'Astro config executed' }
      - run: cargo xtask go-semantic-e2e
      - run: cargo xtask rust-semantic-e2e
