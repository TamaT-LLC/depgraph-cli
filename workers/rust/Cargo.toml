[package]
name = "depgraph-rust-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
depgraph-protocol = { path = "../../crates/depgraph-protocol" }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
ra_ap_hir.workspace = true
ra_ap_ide_db.workspace = true
ra_ap_syntax.workspace = true
ra_ap_vfs.workspace = true
salsa.workspace = true
salsa-macro-rules.workspace = true
salsa-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
tempfile.workspace = true
toml.workspace = true
triomphe.workspace = true
walkdir.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
