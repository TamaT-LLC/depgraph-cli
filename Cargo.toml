[workspace]
resolver = "2"
members = [
  "crates/depgraph-cli",
  "crates/depgraph-core",
  "crates/depgraph-protocol",
  "crates/depgraph-store",
  "workers/rust",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TamaT-LLC/depgraph-cli"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
hex = "0.4"
libc = "0.2"
petgraph = "0.8"
predicates = "3.1"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = "symbols"
