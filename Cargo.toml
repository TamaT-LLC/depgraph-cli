[workspace]
resolver = "2"
members = [
  "crates/depgraph-cli",
  "crates/depgraph-core",
  "crates/depgraph-mcp-tools",
  "crates/depgraph-mcp",
  "crates/depgraph-protocol",
  "crates/depgraph-rustc-wrapper",
  "crates/depgraph-store",
  "workers/rust",
  "xtask",
]
exclude = ["crates/depgraph-rustc-query"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TamaT-LLC/depgraph-cli"
rust-version = "1.93"

[workspace.metadata.depgraph.rust-analyzer]
crate-version = "0.0.330"
revision = "8954b66d43225e62c92e8bbcc8500191b5cceb1e"
salsa-version = "0.26.1"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
hex = "0.4"
ignore = "0.4"
libc = "0.2"
notify = "8.2.0"
petgraph = "0.8"
predicates = "3.1"
prost = "0.14"
prost-types = "0.14"
ra_ap_hir = "=0.0.330"
ra_ap_ide_db = "=0.0.330"
ra_ap_syntax = "=0.0.330"
ra_ap_vfs = "=0.0.330"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "hooks"] }
salsa = "=0.26.1"
salsa-macro-rules = "=0.26.1"
salsa-macros = "=0.26.1"
schemars = "=1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = "1.9"
walkdir = "2.5"

[profile.release]
lto = "thin"
strip = "symbols"
