[workspace]
resolver = "2"
members = [
  "crates/depgraph-agent-contract",
  "crates/depgraph-cli",
  "crates/depgraph-contract-scan",
  "crates/depgraph-core",
  "crates/depgraph-mcp",
  "crates/depgraph-operation",
  "crates/depgraph-protocol",
  "crates/depgraph-rustc-wrapper",
  "crates/depgraph-store",
  "workers/rust",
  "workspace-hack",
  "xtask",
]
exclude = ["crates/depgraph-rustc-query"]

[workspace.package]
version = "0.7.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TamaT-LLC/depgraph-cli"
rust-version = "1.93"

[workspace.metadata.depgraph.rust-analyzer]
crate-version = "0.0.330"
revision = "8954b66d43225e62c92e8bbcc8500191b5cceb1e"
salsa-version = "0.26.1"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
caseless = "0.2.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
getrandom = "0.3"
hex = "0.4"
ignore = "0.4"
libc = "0.2"
notify = "8.2.0"
petgraph = "0.8"
predicates = "3.1"
prost = "0.14"
prost-types = "0.14"
ra_ap_hir = "=0.0.330"
ra_ap_ide_db = "=0.0.330"
ra_ap_syntax = "=0.0.330"
ra_ap_vfs = "=0.0.330"
rusqlite = { version = "0.37", features = ["bundled", "chrono", "hooks", "limits"] }
salsa = "=0.26.1"
salsa-macro-rules = "=0.26.1"
salsa-macros = "=0.26.1"
schemars = "=1.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "visit"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = "1.9"
walkdir = "2.5"

# 依存クレートを最適化する。sha2 と ra_ap_* が無最適化だと桁違いに遅く、
# rust worker のテストが 15 倍遅くなるため。
[profile.dev.package."*"]
opt-level = 2

# 自前クレートは、依存の根元にある depgraph-protocol だけを opt-level 1 にし、
# 残りは 0 のままにする。opt-level 0 と 1 では generic の実体化を上流クレートと
# 共有する（share-generics）ため、下流の core や mcp も protocol が実体化した
# serde_json などを借りて使う。上位のテストは約 1.5〜2 倍速くなり、自前クレートの
# 再ビルドは wall で数秒、CPU 時間で約 1.2〜1.4 倍に増える。agent-contract と
# store も opt-level 1 にすると、テストはさらに 2〜4 割速くなるが、再ビルドの
# CPU 時間が全部 opt-level 0 のときの約 2 倍になるため足さない。
# debug-assertions と overflow-checks は dev の既定どおり有効のまま。
[profile.dev.package.depgraph-protocol]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"

# Optimized build for the CPU-bound evidence gates (`cargo xtask
# go-loader-scope-e2e`, `resumable-analysis-e2e`, `health-range-e2e`). The dev
# profile leaves the workspace crates at opt-level 0, which dominates their
# runtime. It differs from release only where release would make the gates
# slower to build or weaker as checks:
# - no LTO and parallel codegen, so the workspace crates rebuild quickly on
#   every CI run (rust-cache never keeps workspace crate artifacts);
# - debug assertions and overflow checks stay on, so the gates still trip the
#   same invariants the dev build does (the assertions in the scanned paths are
#   O(1));
# - symbols are kept so a panic backtrace still names its frames.
# Debuginfo stays off (inherited) and incremental stays off: incremental state
# is not reusable across CI runs and only grows the cached target directory.
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true
overflow-checks = true
strip = "none"

# Crates outside the CLI's scan path build at opt-level 0, which cuts the
# per-run rebuild without slowing the gates:
# - xtask only builds and spawns the CLI and the gate runners, then checks
#   their reports;
# - depgraph-contract-scan is not linked into the CLI (depgraph-core only uses
#   it as a dev-dependency, which the health-range example pulls in);
# - depgraph-operation and depgraph-agent-contract serve agent/MCP setup and
#   constant-time command and result mapping in the CLI, never the scan.
# Debug assertions and overflow checks are profile-wide, so they stay on here.
[profile.e2e.package.xtask]
opt-level = 0

[profile.e2e.package.depgraph-contract-scan]
opt-level = 0

[profile.e2e.package.depgraph-operation]
opt-level = 0

[profile.e2e.package.depgraph-agent-contract]
opt-level = 0
